name: Build BlissAspects Tactical SMP Engine

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile Kinematic Engine & Resource Matrix
        shell: python
        run: |
          import os, zipfile, struct, zlib

          def save(path, text):
              d = os.path.dirname(path)
              if d: os.makedirs(d, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text.strip())

          save("pom.xml", r"""<?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.bliss</groupId>
              <artifactId>BlissAspects</artifactId>
              <version>20.0.0-MASTER</version>
              <packaging>jar</packaging>
              <properties><java.version>21</java.version><project.build.sourceEncoding>UTF-8</project.build.sourceEncoding></properties>
              <repositories><repository><id>papermc</id><url>https://repo.papermc.io/repository/maven-public/</url></repository></repositories>
              <dependencies><dependency><groupId>io.papermc.paper</groupId><artifactId>paper-api</artifactId><version>1.21.1-R0.1-SNAPSHOT</version><scope>provided</scope></dependency></dependencies>
              <build><finalName>BlissAspects</finalName><plugins><plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-compiler-plugin</artifactId><version>3.13.0</version><configuration><source>21</source><target>21</target></configuration></plugin></plugins></build>
          </project>""")

          save("src/main/resources/plugin.yml", r"""name: BlissAspects
          version: 20.0.0-MASTER
          main: com.bliss.aspects.BlissAspects
          api-version: '1.21'
          commands:
            aspect:
              permission: bliss.use
              description: Tactical Aspect Interface""")

          save("src/main/resources/config.yml", r"""# BlissAspects Tactical Cooldown Matrix (Seconds)
          cooldowns:
            EMBER: {m1: 14.0, m2: 18.0}
            FROST: {m1: 16.0, m2: 20.0}
            BOLT: {m1: 12.0, m2: 22.0}
            TOXIN: {m1: 15.0, m2: 24.0}
            SOL: {m1: 18.0, m2: 25.0}
            PHANTOM: {m1: 14.0, m2: 22.0}
            AEGIS: {m1: 20.0, m2: 28.0}
            TITAN: {m1: 16.0, m2: 24.0}
            REAPER: {m1: 15.0, m2: 30.0}
            PARADOX: {m1: 25.0, m2: 35.0}""")

          save("src/main/java/com/bliss/aspects/BlissAspects.java", r"""package com.bliss.aspects;

          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.*;
          import org.bukkit.*;
          import org.bukkit.Particle.DustOptions;
          import org.bukkit.attribute.Attribute;
          import org.bukkit.attribute.AttributeInstance;
          import org.bukkit.attribute.AttributeModifier;
          import org.bukkit.block.Block;
          import org.bukkit.block.data.BlockData;
          import org.bukkit.command.*;
          import org.bukkit.enchantments.Enchantment;
          import org.bukkit.entity.*;
          import org.bukkit.event.*;
          import org.bukkit.event.block.Action;
          import org.bukkit.event.entity.*;
          import org.bukkit.event.player.*;
          import org.bukkit.inventory.*;
          import org.bukkit.inventory.meta.Damageable;
          import org.bukkit.inventory.meta.ItemMeta;
          import org.bukkit.persistence.*;
          import org.bukkit.plugin.java.JavaPlugin;
          import org.bukkit.potion.*;
          import org.bukkit.scheduler.BukkitRunnable;
          import org.bukkit.scheduler.BukkitTask;
          import org.bukkit.util.RayTraceResult;
          import org.bukkit.util.Vector;
          import java.util.*;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.function.Consumer;

          public final class BlissAspects extends JavaPlugin {
              private CooldownManager cd;
              private GemManager gm;
              private final Map<UUID, Location[]> timelineBuffer = new ConcurrentHashMap<>();

              @Override
              public void onEnable() {
                  saveDefaultConfig();
                  this.cd = new CooldownManager(this);
                  this.gm = new GemManager(this);
                  getServer().getPluginManager().registerEvents(new AspectListener(this, cd, gm), this);
                  AspectCommand cmd = new AspectCommand(this, cd, gm);
                  Objects.requireNonNull(getCommand("aspect")).setExecutor(cmd);
                  Objects.requireNonNull(getCommand("aspect")).setTabCompleter(cmd);

                  // Kinematic Sub-Tick Ambient Engine
                  Bukkit.getScheduler().runTaskTimer(this, () -> {
                      for (Player p : Bukkit.getOnlinePlayers()) {
                          ItemStack gem = gm.getWieldedGem(p);
                          if (gem == null) {
                              resetAttributes(p);
                              continue;
                          }
                          AspectType t = gm.getGemAspect(gem);
                          if (t == null) continue;

                          int tier = Math.min(5, gm.getGemKills(gem));
                          Location loc = p.getLocation().add(0, 0.2, 0);

                          if (tier == 5) {
                              VectorMath.drawTorus(loc.clone().add(0, 1.8, 0), 0.4, 0.1, Particle.END_ROD, 1);
                              VectorMath.spawnDust(loc.clone().add(0, 1.8, 0), t.getPrimaryColor(), 1.0f, 2);
                          }

                          VectorMath.spawnDust(loc, t.getPrimaryColor(), 0.8f, tier >= 3 ? 4 : 2);
                          
                          // Timeline Buffer for Phantom P2 (3 seconds = 60 ticks. We sample every 20 ticks = 3 slots)
                          Location[] buffer = timelineBuffer.computeIfAbsent(p.getUniqueId(), k -> new Location[3]);
                          buffer[2] = buffer[1];
                          buffer[1] = buffer[0];
                          buffer[0] = p.getLocation().clone();

                          switch (t) {
                              case EMBER -> {
                                  if (p.getLocation().getBlock().getType() == Material.FIRE || p.getLocation().getBlock().getType() == Material.LAVA) {
                                      AttributeInstance atk = p.getAttribute(Attribute.GENERIC_ATTACK_SPEED);
                                      if (atk != null) atk.setBaseValue(100.0); // 0 CD
                                  } else {
                                      resetAttackSpeed(p);
                                  }
                              }
                              case FROST -> {
                                  Block b = p.getLocation().subtract(0, 1, 0).getBlock();
                                  if (b.getType() == Material.WATER) b.setType(Material.FROSTED_ICE);
                                  if (p.isSprinting() && (b.getType() == Material.ICE || b.getType() == Material.PACKED_ICE || b.getType() == Material.BLUE_ICE)) {
                                      p.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, 30, 1, false, false, false));
                                  }
                              }
                              case BOLT -> {
                                  if (p.getFallDistance() > 4.0) p.getPersistentDataContainer().set(new NamespacedKey(this, "bolt_charge"), PersistentDataType.BYTE, (byte)1);
                                  if (p.isSprinting()) {
                                      int sprintTicks = p.getPersistentDataContainer().getOrDefault(new NamespacedKey(this, "bolt_sprint"), PersistentDataType.INTEGER, 0);
                                      p.getPersistentDataContainer().set(new NamespacedKey(this, "bolt_sprint"), PersistentDataType.INTEGER, sprintTicks + 20);
                                      if (sprintTicks > 50) { // 2.5s
                                          p.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, 40, 2, false, false, false));
                                          AttributeInstance kb = p.getAttribute(Attribute.GENERIC_KNOCKBACK_RESISTANCE);
                                          if (kb != null) kb.setBaseValue(1.0);
                                      }
                                  } else {
                                      p.getPersistentDataContainer().set(new NamespacedKey(this, "bolt_sprint"), PersistentDataType.INTEGER, 0);
                                      AttributeInstance kb = p.getAttribute(Attribute.GENERIC_KNOCKBACK_RESISTANCE);
                                      if (kb != null) kb.setBaseValue(0.0);
                                  }
                              }
                              case PHANTOM -> {
                                  AttributeInstance weight = p.getAttribute(Attribute.GENERIC_MOVEMENT_SPEED);
                                  if (p.getHealth() <= 10.0 && weight != null) weight.setBaseValue(0.13); // +30% speed
                                  else if (weight != null) weight.setBaseValue(0.1);
                                  
                                  if (p.getHealth() <= 6.0 && p.getPersistentDataContainer().getOrDefault(new NamespacedKey(this, "ph_split"), PersistentDataType.BYTE, (byte)0) == 1) {
                                      if (buffer[2] != null) p.teleport(buffer[2]);
                                      p.setHealth(Math.min(20.0, p.getHealth() + 10.0));
                                      p.getPersistentDataContainer().set(new NamespacedKey(this, "ph_split"), PersistentDataType.BYTE, (byte)0);
                                      p.getWorld().playSound(p.getLocation(), Sound.ENTITY_ENDERMAN_TELEPORT, 2f, 0.5f);
                                      VectorMath.drawSphere(p.getLocation(), 2.0, Particle.REVERSE_PORTAL, 40);
                                  }
                              }
                              case SOL -> {
                                  AttributeInstance reach = p.getAttribute(Attribute.PLAYER_ENTITY_INTERACTION_RANGE);
                                  if (p.getWorld().getTime() < 12000 && p.getLocation().getBlock().getLightFromSky() == 15) {
                                      p.getPersistentDataContainer().set(new NamespacedKey(this, "sol_buff"), PersistentDataType.BYTE, (byte)1);
                                      p.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, 40, 0, false, false, false));
                                      if (reach != null) reach.setBaseValue(3.5); // +0.5 reach
                                  } else {
                                      p.getPersistentDataContainer().remove(new NamespacedKey(this, "sol_buff"));
                                      if (reach != null) reach.setBaseValue(3.0);
                                  }
                                  for (Entity e : p.getNearbyEntities(8, 8, 8)) {
                                      if (e instanceof Player ally && !ally.equals(p)) {
                                          ally.addPotionEffect(new PotionEffect(PotionEffectType.RESISTANCE, 40, 0, false, false, false));
                                      }
                                  }
                              }
                              case TITAN -> {
                                  for (Entity e : p.getNearbyEntities(4, 4, 4)) {
                                      if (e instanceof Player en && !en.equals(p)) en.addPotionEffect(new PotionEffect(PotionEffectType.JUMP_BOOST, 40, 200, false, false, false));
                                  }
                                  AttributeInstance kb = p.getAttribute(Attribute.GENERIC_KNOCKBACK_RESISTANCE);
                                  if (p.isSneaking() && kb != null) kb.setBaseValue(1.0);
                                  else if (kb != null) kb.setBaseValue(0.0);
                              }
                              default -> resetAttributes(p);
                          }
                      }
                  }, 0L, 20L);
              }

              private void resetAttributes(Player p) {
                  AttributeInstance atk = p.getAttribute(Attribute.GENERIC_ATTACK_SPEED);
                  if (atk != null) atk.setBaseValue(4.0);
                  AttributeInstance kb = p.getAttribute(Attribute.GENERIC_KNOCKBACK_RESISTANCE);
                  if (kb != null) kb.setBaseValue(0.0);
                  AttributeInstance speed = p.getAttribute(Attribute.GENERIC_MOVEMENT_SPEED);
                  if (speed != null) speed.setBaseValue(0.1);
                  AttributeInstance reach = p.getAttribute(Attribute.PLAYER_ENTITY_INTERACTION_RANGE);
                  if (reach != null) reach.setBaseValue(3.0);
              }

              public void runKinematicTask(int dur, int period, Consumer<Integer> action) {
                  new BukkitRunnable() {
                      int elapsed = 0;
                      public void run() {
                          try { action.accept(elapsed); } 
                          catch (Exception e) { cancel(); } 
                          finally { elapsed += period; if (elapsed >= dur) cancel(); }
                      }
                  }.runTaskTimer(this, 0L, period);
              }
          }

          final class VectorMath {
              private VectorMath() {}
              public static void spawnDust(Location loc, Color c, float size, int count) {
                  if (loc.getWorld() != null) loc.getWorld().spawnParticle(Particle.DUST, loc, count, 0.2, 0.2, 0.2, 0.0, new DustOptions(c, size));
              }
              public static void drawDustRing(Location c, double r, Color col, int pts) {
                  DustOptions d = new DustOptions(col, 1.2f);
                  for (int i=0; i<pts; i++) {
                      double a = 2.0*Math.PI*i/pts;
                      c.getWorld().spawnParticle(Particle.DUST, c.clone().add(Math.cos(a)*r, 0.05, Math.sin(a)*r), 1, 0,0,0,0, d);
                  }
              }
              public static void drawParticleRing(Location c, double r, Particle p, int pts, double speed) {
                  for (int i=0; i<pts; i++) {
                      double a = 2.0*Math.PI*i/pts;
                      c.getWorld().spawnParticle(p, c.clone().add(Math.cos(a)*r, 0.05, Math.sin(a)*r), 1, 0,0,0, speed);
                  }
              }
              public static void drawTorus(Location c, double R, double r, Particle p, int density) {
                  for (int i=0; i<density; i++) {
                      double t = Math.random()*2*Math.PI, f = Math.random()*2*Math.PI;
                      c.getWorld().spawnParticle(p, c.clone().add((R+r*Math.cos(t))*Math.cos(f), r*Math.sin(t), (R+r*Math.cos(t))*Math.sin(f)), 1, 0,0,0, 0);
                  }
              }
              public static void drawTrefoilKnot(Location c, double scale, Particle p) {
                  for (double t=0; t<Math.PI*2; t+=0.15) {
                      double x = scale * (Math.sin(t) + 2*Math.sin(2*t));
                      double y = scale * (Math.cos(t) - 2*Math.cos(2*t));
                      double z = scale * (-Math.sin(3*t));
                      c.getWorld().spawnParticle(p, c.clone().add(x, y+1.5, z), 1, 0,0,0, 0);
                  }
              }
              public static void drawBezierCurve(Location p0, Location p1, Location p2, Particle p, int segments) {
                  for (int i=0; i<=segments; i++) {
                      double t = i / (double)segments;
                      double x = Math.pow(1-t,2)*p0.getX() + 2*(1-t)*t*p1.getX() + Math.pow(t,2)*p2.getX();
                      double y = Math.pow(1-t,2)*p0.getY() + 2*(1-t)*t*p1.getY() + Math.pow(t,2)*p2.getY();
                      double z = Math.pow(1-t,2)*p0.getZ() + 2*(1-t)*t*p1.getZ() + Math.pow(t,2)*p2.getZ();
                      p0.getWorld().spawnParticle(p, new Location(p0.getWorld(), x, y, z), 1, 0,0,0, 0);
                  }
              }
              public static void drawCylinder(Location c, double r, double h, Particle p, int density) {
                  for (double y=0; y<=h; y+=0.5) drawParticleRing(c.clone().add(0,y,0), r, p, density, 0);
              }
              public static void drawSphere(Location c, double r, Particle p, int count) {
                  for (int i=0; i<count; i++) {
                      double u = Math.random(), v = Math.random();
                      double t = 2 * Math.PI * u, phi = Math.acos(2 * v - 1);
                      c.getWorld().spawnParticle(p, c.clone().add(r*Math.sin(phi)*Math.cos(t), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(t)), 1, 0,0,0, 0);
                  }
              }
          }

          enum AspectType {
              EMBER("Ember", NamedTextColor.RED, 1001, Color.fromRGB(255, 60, 20), Color.fromRGB(255, 150, 0),
                    "Fissure Slam", "Plasma Sear", "Magma Wave", "Cataclysmic Supernova", "Fire Aspect III & Lava DMG Boost", "RARE"),
              FROST("Frost", TextColor.color(0x70D6FF), 1002, Color.fromRGB(100, 220, 255), Color.fromRGB(240, 255, 255),
                    "Blue Ice Patch", "Freeze Indicator", "Deep Freeze Root", "Absolute Zero", "Sharpness VI & Ice Speed", "RARE"),
              BOLT("Bolt", NamedTextColor.YELLOW, 1003, Color.fromRGB(255, 255, 0), Color.fromRGB(255, 255, 180),
                    "Railgun Jet", "Phase Shift Swap", "Static Discharge", "Overcharge Reset", "Efficiency VI & Fall Strike", "RARE"),
              TOXIN("Toxin", NamedTextColor.DARK_GREEN, 1004, Color.fromRGB(40, 180, 40), Color.fromRGB(120, 255, 120),
                    "Neural Dart", "Hotbar Rot", "Corrosion Meltdown", "Venomous Eden", "Unbreaking V & Gapple Boost", "EPIC"),
              SOL("Sol", NamedTextColor.GOLD, 1005, Color.fromRGB(255, 200, 50), Color.fromRGB(255, 255, 200),
                    "Daybreak Pillar", "Solar Flare Blind", "Supernova Strip", "Judgment of Heavens", "Smite VII & Solar Melee Boost", "EPIC"),
              PHANTOM("Phantom", NamedTextColor.DARK_GRAY, 1006, Color.fromRGB(60, 60, 70), Color.fromRGB(150, 150, 180),
                    "Rewind Anchor", "Gravity Flip", "Phase Ambush", "Timeline Split", "Depth Strider IV & True Backstab", "EPIC"),
              AEGIS("Aegis", TextColor.color(0xFFD166), 1007, Color.fromRGB(255, 215, 60), Color.fromRGB(255, 255, 220),
                    "Impact Mirror", "Tectonic Pull", "Counter-Stun", "Grand Sanctuary", "Protection V & Reflection Ward", "LEGENDARY"),
              TITAN("Titan", NamedTextColor.GRAY, 1008, Color.fromRGB(120, 120, 120), Color.fromRGB(180, 100, 50),
                    "Singularity Orb", "Magnetic Chain", "Event Horizon", "Gravity Slam", "Knockback III & 0-KB Sneak", "LEGENDARY"),
              REAPER("Reaper", NamedTextColor.DARK_PURPLE, 1009, Color.fromRGB(0, 255, 210), Color.fromRGB(90, 20, 160),
                    "Frame Parry", "Kinetic Link", "Soul Harvest", "Death Essence Wave", "Looting IV & Kill Reset", "GODLIKE"),
              PARADOX("Paradox", NamedTextColor.LIGHT_PURPLE, 1010, Color.fromRGB(255, 80, 255), Color.fromRGB(100, 0, 100),
                    "Time-Clone", "Distortion Dome", "Timeline Shatter", "Temporal Delay", "Soul Speed IV & Fatal Invuln", "GODLIKE");

              private final String d, m1, m2, m3, p, rarity;
              private final int cmd;
              private final TextColor c;
              private final Color priCol, secCol;

              AspectType(String d, TextColor c, int cmd, Color priCol, Color secCol, String m1, String m2, String m3, String p, String rarity) {
                  this.d = d; this.c = c; this.cmd = cmd; this.priCol = priCol; this.secCol = secCol;
                  this.m1 = m1; this.m2 = m2; this.m3 = m3; this.p = p; this.rarity = rarity;
              }
              public String getDisplayName() { return d; }
              public int getCustomModelData() { return cmd; }
              public Color getPrimaryColor() { return priCol; }
              public Color getSecondaryColor() { return secCol; }
              public String getM1() { return m1; }
              public String getM2() { return m2; }
              public String getM3() { return m3; }
              public String getPassiveDesc() { return p; }
              public String getRarity() { return rarity; }
              public Component getFormattedName() { return Component.text(d, c); }
          }

          class CooldownManager {
              private final BlissAspects pl;
              private final Map<UUID, Map<String, Long>> cd = new HashMap<>();
              public CooldownManager(BlissAspects pl) { this.pl = pl; }
              public double getConfigCooldown(AspectType a, int move) { return pl.getConfig().getDouble("cooldowns." + a.name() + ".m" + move, 15.0); }
              public boolean isOnCooldown(Player p, String k) {
                  var m = cd.get(p.getUniqueId());
                  return m != null && m.containsKey(k) && System.currentTimeMillis() < m.get(k);
              }
              public double getRemaining(Player p, String k) {
                  var m = cd.get(p.getUniqueId());
                  if (m == null || !m.containsKey(k)) return 0.0;
                  return Math.max(0.0, (m.get(k) - System.currentTimeMillis()) / 1000.0);
              }
              public void setCooldown(Player p, String k, double s) { cd.computeIfAbsent(p.getUniqueId(), x -> new HashMap<>()).put(k, System.currentTimeMillis() + (long)(s * 1000.0)); }
              public void reset(Player p) { cd.remove(p.getUniqueId()); }
              public void notice(Player p, String n, String k) { p.sendActionBar(Component.text(n + " Cooldown: " + String.format("%.1f", getRemaining(p, k)) + "s", NamedTextColor.RED)); }
          }

          class GemManager {
              private final NamespacedKey ak, kk, uk;
              public GemManager(JavaPlugin pl) {
                  this.ak = new NamespacedKey(pl, "b_asp");
                  this.kk = new NamespacedKey(pl, "b_kls");
                  this.uk = new NamespacedKey(pl, "b_ukills");
              }
              public ItemStack createGem(AspectType a, int kills) {
                  ItemStack it = new ItemStack(Material.NETHER_STAR);
                  updateMeta(it, a, kills);
                  return it;
              }
              public void updateMeta(ItemStack it, AspectType a, int kills) {
                  ItemMeta m = it.getItemMeta();
                  if (m == null) return;
                  int tier = Math.min(5, kills);
                  String stars = "★".repeat(Math.max(1, tier)) + "☆".repeat(Math.max(0, 5 - tier));
                  String progress = "█".repeat(tier * 2) + "░".repeat(10 - (tier * 2));

                  m.displayName(Component.text("【 ❖ ", NamedTextColor.WHITE).append(a.getFormattedName().decorate(TextDecoration.BOLD)).append(Component.text(" GEM ❖ 】", NamedTextColor.WHITE)).decoration(TextDecoration.ITALIC, false));
                  List<Component> lore = new ArrayList<>();
                  lore.add(Component.text("✦ Rarity: ", NamedTextColor.DARK_GRAY).append(Component.text(a.getRarity(), NamedTextColor.LIGHT_PURPLE).decorate(TextDecoration.BOLD)).decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.text("✦ Tier:   ", NamedTextColor.DARK_GRAY).append(Component.text(stars, NamedTextColor.GOLD)).decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.text("✦ Souls:  [" + progress + "] " + kills + "/5 Players", NamedTextColor.AQUA).decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.text("──────────────────────────────", NamedTextColor.DARK_GRAY).decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.text("✦ PASSIVES:", NamedTextColor.GOLD).decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.text("  " + a.getPassiveDesc(), NamedTextColor.YELLOW).decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.empty());
                  lore.add(Component.text("✦ [R-CLICK]  " + a.getM1(), NamedTextColor.GOLD).decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.text("✦ [L-CLICK]  " + a.getM2(), NamedTextColor.AQUA).decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.text("✦ [COMBO]    " + a.getM3(), NamedTextColor.RED).decorate(TextDecoration.BOLD).decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.text("──────────────────────────────", NamedTextColor.DARK_GRAY).decoration(TextDecoration.ITALIC, false));
                  m.lore(lore);
                  m.setCustomModelData(a.getCustomModelData());
                  m.addEnchant(Enchantment.UNBREAKING, 1, true);
                  m.addItemFlags(ItemFlag.HIDE_ENCHANTS);
                  m.getPersistentDataContainer().set(ak, PersistentDataType.STRING, a.name());
                  m.getPersistentDataContainer().set(kk, PersistentDataType.INTEGER, kills);
                  if (!m.getPersistentDataContainer().has(uk, PersistentDataType.STRING)) m.getPersistentDataContainer().set(uk, PersistentDataType.STRING, "");
                  it.setItemMeta(m);
              }
              public boolean isGem(ItemStack it) { return it != null && it.hasItemMeta() && it.getItemMeta().getPersistentDataContainer().has(ak, PersistentDataType.STRING); }
              public AspectType getGemAspect(ItemStack it) { return isGem(it) ? AspectType.valueOf(it.getItemMeta().getPersistentDataContainer().get(ak, PersistentDataType.STRING)) : null; }
              public int getGemKills(ItemStack it) { return isGem(it) ? it.getItemMeta().getPersistentDataContainer().getOrDefault(kk, PersistentDataType.INTEGER, 0) : 0; }
              public boolean addUniquePlayerKill(ItemStack it, UUID vUUID) {
                  if (!isGem(it)) return false;
                  ItemMeta m = it.getItemMeta();
                  String list = m.getPersistentDataContainer().getOrDefault(uk, PersistentDataType.STRING, "");
                  String vStr = vUUID.toString();
                  if (list.contains(vStr)) return false;
                  m.getPersistentDataContainer().set(uk, PersistentDataType.STRING, list.isEmpty() ? vStr : list + "," + vStr);
                  it.setItemMeta(m);
                  return true;
              }
              public ItemStack getWieldedGem(Player p) {
                  ItemStack main = p.getInventory().getItemInMainHand();
                  if (isGem(main)) return main;
                  ItemStack off = p.getInventory().getItemInOffHand();
                  return isGem(off) ? off : null;
              }
          }

          class AspectListener implements Listener {
              private final BlissAspects pl;
              private final CooldownManager cd;
              private final GemManager gm;
              
              // Tactical Registers
              private final Map<UUID, Long> dashLog = new HashMap<>();
              private final Map<UUID, Location> blueIceLog = new HashMap<>();
              private final Map<UUID, UUID> titanTether = new HashMap<>();
              private final Map<UUID, Integer> reaperMaxHp = new HashMap<>();
              private final Map<UUID, ParadoxState> paradoxAnchors = new HashMap<>();
              private final Set<UUID> timeFrozen = new HashSet<>();
              private final Map<UUID, Long> fatalInvuln = new HashMap<>();
              private final Map<UUID, Long> impactMirror = new HashMap<>();
              private final Map<UUID, Double> impactStored = new HashMap<>();
              private final Map<UUID, Long> frameParry = new HashMap<>();

              private static class ParadoxState {
                  Location l; double hp; ItemStack[] inv; Vector v;
                  ParadoxState(Player p) { this.l = p.getLocation().clone(); this.hp = p.getHealth(); this.inv = p.getInventory().getContents().clone(); this.v = p.getVelocity().clone(); }
              }

              public AspectListener(BlissAspects pl, CooldownManager cd, GemManager gm) {
                  this.pl = pl; this.cd = cd; this.gm = gm;
              }

              private boolean isConsumable(Material m) {
                  if (m == null || m.isAir()) return false;
                  if (m.isEdible()) return true;
                  String n = m.name();
                  return n.contains("POTION") || n.equals("BOW") || n.equals("CROSSBOW") || n.equals("SHIELD") || n.equals("ENDER_PEARL") || n.equals("WIND_CHARGE") || n.equals("TRIDENT");
              }

              @EventHandler(priority = EventPriority.HIGHEST)
              public void onDamage(EntityDamageEvent e) {
                  if (e.getEntity() instanceof Player p) {
                      ItemStack gem = gm.getWieldedGem(p);
                      if (gem != null) {
                          AspectType a = gm.getGemAspect(gem);
                          if (a == AspectType.EMBER && (e.getCause() == EntityDamageEvent.DamageCause.LAVA || e.getCause() == EntityDamageEvent.DamageCause.FIRE || e.getCause() == EntityDamageEvent.DamageCause.FIRE_TICK)) {
                              e.setCancelled(true); return;
                          }
                          if (a == AspectType.BOLT && e.getCause() == EntityDamageEvent.DamageCause.FALL) {
                              e.setCancelled(true); 
                              if (p.getFallDistance() > 4.0) p.getPersistentDataContainer().set(new NamespacedKey(pl, "bolt_charge"), PersistentDataType.BYTE, (byte)1);
                              return;
                          }
                          if (a == AspectType.PARADOX) {
                              if (p.getHealth() - e.getFinalDamage() <= 0) {
                                  if (!cd.isOnCooldown(p, "paradox_fatal")) {
                                      e.setCancelled(true);
                                      p.setHealth(1.0);
                                      cd.setCooldown(p, "paradox_fatal", 480.0); // 8 Mins
                                      fatalInvuln.put(p.getUniqueId(), System.currentTimeMillis() + 2000);
                                      p.getWorld().spawnParticle(Particle.SONIC_BOOM, p.getLocation().add(0,1,0), 1);
                                      p.getWorld().playSound(p.getLocation(), Sound.ITEM_TOTEM_USE, 2f, 1f);
                                      for(Entity ent : p.getNearbyEntities(4,4,4)) if(ent instanceof LivingEntity tg) tg.setVelocity(tg.getLocation().toVector().subtract(p.getLocation().toVector()).normalize().multiply(1.5));
                                      return;
                                  }
                              }
                          }
                          if (fatalInvuln.containsKey(p.getUniqueId()) && System.currentTimeMillis() < fatalInvuln.get(p.getUniqueId())) {
                              e.setCancelled(true);
                          }
                          if (impactMirror.containsKey(p.getUniqueId()) && System.currentTimeMillis() < impactMirror.get(p.getUniqueId())) {
                              impactStored.put(p.getUniqueId(), impactStored.getOrDefault(p.getUniqueId(), 0.0) + e.getDamage());
                              e.setDamage(e.getDamage() * 0.5);
                          }
                      }
                  }
              }

              @EventHandler(priority = EventPriority.HIGH)
              public void onHit(EntityDamageByEntityEvent e) {
                  if (e.getEntity() instanceof Player v && timeFrozen.contains(v.getUniqueId())) {
                      e.setCancelled(true); // Frozen in time, cannot take normal dmg
                      return;
                  }

                  if (e.getDamager() instanceof Player p) {
                      ItemStack gem = gm.getWieldedGem(p);
                      if (gem != null) {
                          AspectType a = gm.getGemAspect(gem);
                          
                          // EMBER: Lava Dmg Boost & Ignite Autocrit
                          if (a == AspectType.EMBER) {
                              if (p.getLocation().getBlock().getType() == Material.FIRE || p.getLocation().getBlock().getType() == Material.LAVA) e.setDamage(e.getDamage() + 3.0);
                              if (e.getEntity().getFireTicks() > 0) {
                                  e.setDamage(e.getDamage() * 1.5);
                                  p.getWorld().spawnParticle(Particle.CRIT, e.getEntity().getLocation().add(0, 1.2, 0), 20, 0.2, 0.2, 0.2, 0.1);
                                  p.getWorld().playSound(p.getLocation(), Sound.ENTITY_PLAYER_ATTACK_CRIT, 1.8f, 0.8f);
                              }
                          }

                          // FROST: Crit breaks stance
                          if (a == AspectType.FROST && e.isCritical() && e.getEntity() instanceof Player tg) {
                              tg.addPotionEffect(new PotionEffect(PotionEffectType.WEAKNESS, 60, 1));
                          }

                          // BOLT: Fall electric dmg
                          if (a == AspectType.BOLT && p.getPersistentDataContainer().has(new NamespacedKey(pl, "bolt_charge"), PersistentDataType.BYTE)) {
                              e.setDamage(e.getDamage() + 4.0);
                              p.getWorld().strikeLightningEffect(e.getEntity().getLocation());
                              p.getPersistentDataContainer().remove(new NamespacedKey(pl, "bolt_charge"));
                          }

                          // SOL: Sunlight Buff
                          if (a == AspectType.SOL && p.getPersistentDataContainer().has(new NamespacedKey(pl, "sol_buff"), PersistentDataType.BYTE)) {
                              e.setDamage(e.getDamage() + 3.0);
                          }

                          // TOXIN: Durability Damage
                          if (a == AspectType.TOXIN && e.getEntity() instanceof Player tg) {
                              ItemStack chest = tg.getInventory().getChestplate();
                              if (chest != null && chest.getItemMeta() instanceof Damageable dmg) {
                                  dmg.setDamage(dmg.getDamage() + 4);
                                  chest.setItemMeta(dmg);
                              }
                          }

                          // PHANTOM: True Backstab
                          if (a == AspectType.PHANTOM && e.getEntity() instanceof LivingEntity tg) {
                              Vector aDir = p.getLocation().getDirection().setY(0).normalize();
                              Vector vDir = tg.getLocation().getDirection().setY(0).normalize();
                              if (aDir.dot(vDir) > 0.65) {
                                  e.setDamage(e.getDamage() + 5.0);
                                  p.getWorld().spawnParticle(Particle.SQUID_INK, tg.getLocation().add(0, 1.0, 0), 40, 0.3, 0.3, 0.3, 0.1);
                                  p.getWorld().playSound(p.getLocation(), Sound.ENTITY_ZOMBIE_BREAK_WOODEN_DOOR, 2.0f, 0.5f);
                              }
                          }

                          // TITAN: Store Energy
                          if (a == AspectType.TITAN && p.getPersistentDataContainer().has(new NamespacedKey(pl, "titan_charge"), PersistentDataType.BYTE)) {
                              e.setDamage(e.getDamage() * 1.2);
                              p.getWorld().playSound(e.getEntity().getLocation(), Sound.BLOCK_ANVIL_PLACE, 2f, 1.5f);
                              p.getPersistentDataContainer().remove(new NamespacedKey(pl, "titan_charge"));
                          }

                          // REAPER: Death Decay (No heal) & Soul Mark
                          if (a == AspectType.REAPER && e.getEntity() instanceof Player tg) {
                              if (e.isCritical()) {
                                  tg.getPersistentDataContainer().set(new NamespacedKey(pl, "reaper_mark"), PersistentDataType.BYTE, (byte)1);
                                  p.getWorld().spawnParticle(Particle.SOUL, tg.getLocation().add(0, 2, 0), 5, 0.1, 0.1, 0.1, 0.02);
                              } else if (tg.getPersistentDataContainer().has(new NamespacedKey(pl, "reaper_mark"), PersistentDataType.BYTE)) {
                                  tg.getPersistentDataContainer().remove(new NamespacedKey(pl, "reaper_mark"));
                                  Location l = tg.getLocation();
                                  l.setYaw(l.getYaw() + 90f);
                                  tg.teleport(l);
                                  p.getWorld().playSound(tg.getLocation(), Sound.ENTITY_ENDERMAN_TELEPORT, 2f, 2f);
                              }
                          }
                      }
                  }

                  // DEFENSE
                  if (e.getEntity() instanceof Player def) {
                      ItemStack dGem = gm.getWieldedGem(def);
                      
                      // FROST: Crit Reduction
                      if (dGem != null && gm.getGemAspect(dGem) == AspectType.FROST && e.isCritical()) {
                          e.setDamage(e.getDamage() * 0.8);
                      }
                      
                      // REAPER: Frame Parry
                      if (dGem != null && gm.getGemAspect(dGem) == AspectType.REAPER && frameParry.containsKey(def.getUniqueId()) && System.currentTimeMillis() < frameParry.get(def.getUniqueId())) {
                          e.setCancelled(true);
                          def.getWorld().playSound(def.getLocation(), Sound.ITEM_SHIELD_BLOCK, 2f, 2f);
                          if (e.getDamager() instanceof LivingEntity atk) {
                              atk.setVelocity(atk.getLocation().toVector().subtract(def.getLocation().toVector()).normalize().multiply(1.2).setY(0.4));
                          }
                          AttributeInstance as = def.getAttribute(Attribute.GENERIC_ATTACK_SPEED);
                          if(as != null) {
                              as.setBaseValue(100.0);
                              Bukkit.getScheduler().runTaskLater(pl, () -> as.setBaseValue(4.0), 10L);
                          }
                      }
                      
                      // AEGIS: Vector Deflection
                      if (dGem != null && gm.getGemAspect(dGem) == AspectType.AEGIS && def.isSneaking() && e.getDamager() instanceof Projectile proj) {
                          e.setCancelled(true);
                          proj.setVelocity(proj.getVelocity().multiply(-3.0));
                          if (proj.getShooter() instanceof LivingEntity shooter) proj.setShooter(def);
                          def.getWorld().playSound(def.getLocation(), Sound.ITEM_SHIELD_BLOCK, 2f, 1.5f);
                      }
                  }
              }

              @EventHandler
              public void onPlayerMove(PlayerMoveEvent e) {
                  Player p = e.getPlayer();
                  if (timeFrozen.contains(p.getUniqueId())) {
                      if (e.getTo() != null && (e.getFrom().getX() != e.getTo().getX() || e.getFrom().getY() != e.getTo().getY() || e.getFrom().getZ() != e.getTo().getZ())) {
                          e.setTo(e.getFrom()); // Absolute freeze
                      }
                  }
                  
                  // PHANTOM: Sneak Dodge
                  ItemStack gem = gm.getWieldedGem(p);
                  if (gem != null && gm.getGemAspect(gem) == AspectType.PHANTOM && p.isSneaking() && p.isSprinting()) {
                      if (!cd.isOnCooldown(p, "phantom_dodge")) {
                          cd.setCooldown(p, "phantom_dodge", 8.0);
                          Vector left = p.getLocation().getDirection().clone().setY(0).normalize().rotateAroundY(Math.PI/2).multiply(4.0);
                          Location tgt = p.getLocation().add(left);
                          if (tgt.getBlock().isPassable()) {
                              p.teleport(tgt);
                              p.getWorld().spawnParticle(Particle.SQUID_INK, p.getLocation(), 20, 0.2, 0.2, 0.2, 0.05);
                              p.getWorld().playSound(p.getLocation(), Sound.ENTITY_ENDERMAN_TELEPORT, 2f, 1.5f);
                          }
                      }
                  }
              }

              @EventHandler
              public void onInteract(PlayerInteractEvent e) {
                  Player p = e.getPlayer();
                  ItemStack main = p.getInventory().getItemInMainHand();

                  if (isConsumable(main.getType())) return;

                  ItemStack gem = gm.getWieldedGem(p);
                  if (gem == null) return;

                  AspectType a = gm.getGemAspect(gem);

                  Action act = e.getAction();
                  if (act == Action.RIGHT_CLICK_AIR || act == Action.RIGHT_CLICK_BLOCK) {
                      if (castM1(p, a)) e.setCancelled(true);
                  } else if (act == Action.LEFT_CLICK_AIR || act == Action.LEFT_CLICK_BLOCK) {
                      if (main.equals(gem)) {
                          if (castM2(p, a)) e.setCancelled(true);
                      }
                  }
              }

              private boolean castM1(Player p, AspectType a) {
                  String k = "m1";
                  if (a == AspectType.PARADOX) {
                      if (paradoxAnchors.containsKey(p.getUniqueId())) {
                          ParadoxState state = paradoxAnchors.remove(p.getUniqueId());
                          p.teleport(state.l);
                          p.setVelocity(state.v);
                          p.setHealth(state.hp);
                          p.getInventory().setContents(state.inv);
                          p.getWorld().playSound(p.getLocation(), Sound.BLOCK_BEACON_DEACTIVATE, 2f, 2f);
                          VectorMath.drawSphere(p.getLocation(), 2.0, Particle.PORTAL, 40);
                          
                          for (UUID uid : timeFrozen) {
                              Player frozen = Bukkit.getPlayer(uid);
                              if (frozen != null && frozen.getLocation().distanceSquared(p.getLocation()) < 64.0) {
                                  frozen.damage(6.0, p);
                                  p.getWorld().spawnParticle(Particle.SONIC_BOOM, frozen.getLocation().add(0,1,0), 1);
                              }
                          }
                          return true;
                      } else {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getM1(), k); return false; }
                          cd.setCooldown(p, k, cd.getConfigCooldown(a, 1));
                          paradoxAnchors.put(p.getUniqueId(), new ParadoxState(p));
                          p.getWorld().playSound(p.getLocation(), Sound.BLOCK_BEACON_ACTIVATE, 2f, 2f);
                          Bukkit.getScheduler().runTaskLater(pl, () -> paradoxAnchors.remove(p.getUniqueId()), 120L); // 6s
                          return true;
                      }
                  }

                  if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getM1(), k); return false; }
                  cd.setCooldown(p, k, cd.getConfigCooldown(a, 1));
                  World w = p.getWorld(); Location eye = p.getEyeLocation();
                  Vector dir = eye.getDirection().normalize();
                  java.util.function.Predicate<Entity> filter = e -> e != p && e instanceof LivingEntity;

                  switch (a) {
                      case EMBER -> {
                          w.playSound(eye, Sound.ENTITY_IRON_GOLEM_ATTACK, 2f, 0.5f);
                          pl.runKinematicTask(30, 2, step -> {
                              Location pt = p.getLocation().add(dir.clone().setY(0).multiply(1.5 + step * 0.4));
                              VectorMath.drawCylinder(pt, 1.2, 2.0, Particle.LAVA, 10);
                              w.playSound(pt, Sound.ENTITY_GENERIC_EXPLODE, 2.0f, 0.6f);
                              for (Entity e : w.getNearbyEntities(pt, 1.5, 3.0, 1.5)) if (e instanceof LivingEntity tg && tg != p) {
                                  tg.damage(5.0, p);
                                  tg.setVelocity(new Vector(0, 1.2, 0));
                                  tg.addPotionEffect(new PotionEffect(PotionEffectType.SLOWNESS, 40, 10)); // Lock movement
                              }
                          });
                      }
                      case FROST -> {
                          for (int x = -1; x <= 1; x++) {
                              for (int z = -1; z <= 1; z++) {
                                  Location pt = eye.clone().add(dir.clone().multiply(3)).add(x, -1, z);
                                  Block b = pt.getBlock();
                                  if (b.getType().isSolid()) {
                                      p.sendBlockChange(b.getLocation(), Material.BLUE_ICE.createBlockData());
                                      Bukkit.getScheduler().runTaskLater(pl, () -> p.sendBlockChange(b.getLocation(), b.getBlockData()), 80L);
                                  }
                              }
                          }
                          w.playSound(eye, Sound.BLOCK_GLASS_PLACE, 2f, 0.5f);
                      }
                      case BOLT -> {
                          Location tgt = eye.clone().add(dir.multiply(6));
                          if (tgt.getBlock().isPassable()) p.teleport(tgt);
                          w.playSound(p.getLocation(), Sound.ENTITY_ENDERMAN_TELEPORT, 2f, 1.5f);
                          w.spawnParticle(Particle.FLASH, p.getLocation(), 1);
                      }
                      case TOXIN -> {
                          RayTraceResult ry = w.rayTraceEntities(eye, dir, 15.0, filter);
                          if (ry != null && ry.getHitEntity() instanceof Player tg) {
                              tg.damage(1.0, p);
                              w.playSound(tg.getLocation(), Sound.ENTITY_SPIDER_DEATH, 2f, 1.5f);
                              VectorMath.drawCylinder(tg.getLocation(), 1.0, 2.0, Particle.HAPPY_VILLAGER, 20);
                              tg.setWalkSpeed(-0.2f); // Invert Controls!
                              Bukkit.getScheduler().runTaskLater(pl, () -> tg.setWalkSpeed(0.2f), 60L);
                          }
                      }
                      case SOL -> {
                          RayTraceResult rt = p.rayTraceBlocks(20.0);
                          Location tgt = (rt != null && rt.getHitPosition() != null) ? rt.getHitPosition().toLocation(w) : eye.clone().add(dir.multiply(12));
                          VectorMath.drawSkyPillar(tgt, 20.0, a.getPrimaryColor(), Particle.END_ROD);
                          w.playSound(tgt, Sound.ITEM_TRIDENT_THUNDER, 2f, 1.5f);
                          for (Entity e : w.getNearbyEntities(tgt, 4, 4, 4)) {
                              if (e instanceof Player ally) {
                                  double mHp = ally.getAttribute(Attribute.GENERIC_MAX_HEALTH)!=null?ally.getAttribute(Attribute.GENERIC_MAX_HEALTH).getValue():20.0;
                                  ally.setHealth(Math.min(mHp, ally.getHealth() + 6.0));
                              }
                              else if (e instanceof LivingEntity tg) { 
                                  tg.addPotionEffect(new PotionEffect(PotionEffectType.NAUSEA, 60, 4));
                                  tg.setVelocity(tg.getLocation().toVector().subtract(tgt.toVector()).normalize().multiply(1.5)); 
                              }
                          }
                      }
                      case PHANTOM -> {
                          p.addPotionEffect(new PotionEffect(PotionEffectType.INVISIBILITY, 100, 0));
                          p.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, 100, 2));
                          w.playSound(eye, Sound.ENTITY_PHANTOM_FLAP, 2f, 1f);
                      }
                      case AEGIS -> {
                          impactMirror.put(p.getUniqueId(), System.currentTimeMillis() + 2500);
                          w.playSound(eye, Sound.BLOCK_BEACON_ACTIVATE, 2f, 2f);
                          pl.runKinematicTask(50, 2, step -> VectorMath.drawSphere(p.getLocation(), 2.0, Particle.END_ROD, 20));
                          Bukkit.getScheduler().runTaskLater(pl, () -> {
                              double stored = impactStored.getOrDefault(p.getUniqueId(), 0.0);
                              w.spawnParticle(Particle.EXPLOSION, p.getLocation().add(0, 1, 0), 2);
                              w.playSound(p.getLocation(), Sound.ENTITY_GENERIC_EXPLODE, 2f, 1f);
                              for (Entity e : p.getNearbyEntities(4, 4, 4)) if (e instanceof LivingEntity tg && tg != p) {
                                  tg.setVelocity(tg.getLocation().toVector().subtract(p.getLocation().toVector()).normalize().multiply(1.2));
                                  tg.damage(stored, p);
                              }
                              impactStored.remove(p.getUniqueId());
                          }, 50L);
                      }
                      case TITAN -> {
                          Item orb = w.dropItem(eye, gm.createGem(AspectType.TITAN, 0));
                          orb.setVelocity(dir.multiply(1.5));
                          new BukkitRunnable() {
                              public void run() {
                                  if (orb.isOnGround() || orb.getTicksLived() > 60) {
                                      Location hit = orb.getLocation();
                                      orb.remove();
                                      w.playSound(hit, Sound.BLOCK_BEACON_DEACTIVATE, 2.0f, 0.5f);
                                      pl.runKinematicTask(60, 2, step -> {
                                          VectorMath.drawDustRing(hit, 4.0, a.getPrimaryColor(), 30);
                                          for (Entity e : w.getNearbyEntities(hit, 8.0, 8.0, 8.0)) if (e instanceof LivingEntity tg && tg != p) {
                                              tg.setVelocity(hit.toVector().subtract(tg.getLocation().toVector()).normalize().multiply(0.4));
                                          }
                                      });
                                      cancel();
                                  }
                              }
                          }.runTaskTimer(pl, 0L, 1L);
                      }
                      case REAPER -> {
                          frameParry.put(p.getUniqueId(), System.currentTimeMillis() + 400); // 0.4s frame perfect
                          w.playSound(eye, Sound.ENTITY_PLAYER_ATTACK_SWEEP, 2f, 1.5f);
                          VectorMath.drawDustRing(p.getLocation().add(0, 1, 0), 1.5, a.getPrimaryColor(), 15);
                      }
                  }
                  return true;
              }

              private boolean castM2(Player p, AspectType a, int tier, double dM) {
                  String k = "m2";
                  if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getM2(), k); return false; }
                  cd.setCooldown(p, k, cd.getConfigCooldown(a, 2));

                  World w = p.getWorld(); Location eye = p.getEyeLocation();
                  Vector dir = eye.getDirection().normalize();
                  java.util.function.Predicate<Entity> filter = e -> e != p && e instanceof LivingEntity;

                  switch (a) {
                      case EMBER -> {
                          RayTraceResult r = w.rayTraceEntities(eye, dir, 15.0, filter);
                          if (r != null && r.getHitEntity() instanceof LivingEntity tg) {
                              pl.runKinematicTask(20, 1, step -> {
                                  tg.getLocation().setPitch(-90f); // Force look up
                                  tg.teleport(tg.getLocation());
                                  VectorMath.drawCylinder(tg.getLocation(), 1.0, 2.0, Particle.FLAME, 10);
                              });
                          }
                      }
                      case FROST -> {
                          p.sendMessage(Component.text("Attack Freeze Active (1.5s)", NamedTextColor.AQUA));
                          w.playSound(eye, Sound.BLOCK_GLASS_CHIME, 2f, 1.5f);
                      }
                      case BOLT -> {
                          RayTraceResult r = w.rayTraceEntities(eye, dir, 15.0, filter);
                          if (r != null && r.getHitEntity() instanceof LivingEntity tg) {
                              Location temp = p.getLocation().clone();
                              p.teleport(tg.getLocation());
                              tg.teleport(temp);
                              w.playSound(p.getLocation(), Sound.ENTITY_ENDERMAN_TELEPORT, 2f, 1.5f);
                              w.spawnParticle(Particle.FLASH, p.getLocation(), 1);
                          }
                      }
                      case TOXIN -> {
                          p.sendMessage(Component.text("Hotbar Rot Active", NamedTextColor.DARK_GREEN));
                          w.playSound(eye, Sound.ENTITY_SPIDER_STEP, 2f, 1f);
                      }
                      case SOL -> {
                          w.spawnParticle(Particle.FLASH, p.getLocation().add(0, 1, 0), 5);
                          w.playSound(eye, Sound.ENTITY_ELDER_GUARDIAN_CURSE, 2f, 2f);
                          for (Entity e : p.getNearbyEntities(12, 12, 12)) if (e instanceof Player tg && tg != p) {
                              Vector dirToMe = p.getLocation().toVector().subtract(tg.getLocation().toVector()).normalize();
                              if (tg.getLocation().getDirection().normalize().dot(dirToMe) > 0.4) tg.addPotionEffect(new PotionEffect(PotionEffectType.BLINDNESS, 50, 1));
                          }
                      }
                      case PHANTOM -> {
                          ArmorStand as = (ArmorStand) w.spawnEntity(p.getLocation(), EntityType.ARMOR_STAND);
                          as.getEquipment().setArmorContents(p.getInventory().getArmorContents());
                          as.setVelocity(dir.multiply(1.5));
                          p.addPotionEffect(new PotionEffect(PotionEffectType.INVISIBILITY, 60, 0));
                          Bukkit.getScheduler().runTaskLater(pl, as::remove, 60L);
                      }
                      case AEGIS -> {
                          Location fwd = eye.clone().add(dir.multiply(2));
                          for (int x = -1; x <= 1; x++) {
                              for (int y = -1; y <= 1; y++) {
                                  Block b = fwd.clone().add(x, y, 0).getBlock();
                                  if (b.getType().isAir()) {
                                      p.sendBlockChange(b.getLocation(), Material.STONE.createBlockData());
                                      Bukkit.getScheduler().runTaskLater(pl, () -> p.sendBlockChange(b.getLocation(), b.getBlockData()), 80L);
                                  }
                              }
                          }
                          w.playSound(eye, Sound.BLOCK_STONE_PLACE, 2f, 0.5f);
                      }
                      case TITAN -> {
                          RayTraceResult r = w.rayTraceEntities(eye, dir, 15.0, filter);
                          if (r != null && r.getHitEntity() instanceof Player tg) {
                              titanTether.put(p.getUniqueId(), tg.getUniqueId());
                              w.playSound(p.getLocation(), Sound.ENTITY_LEASH_KNOT_PLACE, 2f, 1f);
                              pl.runKinematicTask(120, 2, step -> {
                                  if (titanTether.containsKey(p.getUniqueId())) {
                                      VectorMath.drawBezierCurve(p.getLocation().add(0,1,0), p.getLocation().add(0,3,0), tg.getLocation().add(0,1,0), Particle.CRIT, 15);
                                      if (p.getLocation().distanceSquared(tg.getLocation()) > 36.0) tg.setVelocity(p.getLocation().toVector().subtract(tg.getLocation().toVector()).normalize().multiply(0.8));
                                  }
                              });
                              Bukkit.getScheduler().runTaskLater(pl, () -> titanTether.remove(p.getUniqueId()), 120L);
                          }
                      }
                      case REAPER -> {
                          RayTraceResult r = w.rayTraceEntities(eye, dir, 15.0, filter);
                          if (r != null && r.getHitEntity() instanceof Player tg) {
                              pl.runKinematicTask(80, 2, step -> {
                                  VectorMath.drawBezierCurve(p.getLocation().add(0,1,0), p.getLocation().add(0,3,0), tg.getLocation().add(0,1,0), Particle.SOUL, 15);
                                  tg.setVelocity(p.getVelocity()); // Force exact velocity link
                              });
                          }
                      }
                      case PARADOX -> {
                          RayTraceResult r = w.rayTraceEntities(eye, dir, 15.0, filter);
                          if (r != null && r.getHitEntity() instanceof Player tg) {
                              timeFrozen.add(tg.getUniqueId());
                              w.playSound(tg.getLocation(), Sound.BLOCK_GLASS_BREAK, 2f, 0.5f);
                              VectorMath.drawCube(tg.getLocation(), 2.0, Particle.END_ROD, null);
                              Bukkit.getScheduler().runTaskLater(pl, () -> timeFrozen.remove(tg.getUniqueId()), 30L); // 1.5s
                          }
                      }
                  }
                  return true;
              }
          }

          class AspectCommand implements CommandExecutor, TabCompleter {
              private final BlissAspects pl;
              private final CooldownManager cd;
              private final GemManager gm;
              public AspectCommand(BlissAspects pl, CooldownManager cd, GemManager gm) { this.pl = pl; this.cd = cd; this.gm = gm; }

              public boolean onCommand(CommandSender s, Command c, String l, String[] a) {
                  if (a.length == 0) return true;
                  if (a[0].equalsIgnoreCase("give") && s.hasPermission("bliss.admin")) {
                      Player target = Bukkit.getPlayer(a[1]);
                      if (target == null) return true;
                      try {
                          AspectType t = AspectType.valueOf(a[2].toUpperCase());
                          int k = a.length >= 4 ? Integer.parseInt(a[3]) : 0;
                          target.getInventory().addItem(gm.createGem(t, k));
                      } catch (Exception ex) {}
                      return true;
                  }
                  if (a[0].equalsIgnoreCase("resetcd") && s.hasPermission("bliss.admin")) {
                      Player target = Bukkit.getPlayer(a[1]);
                      if (target != null) cd.reset(target);
                      return true;
                  }
                  return true;
              }
              public List<String> onTabComplete(CommandSender s, Command c, String al, String[] a) {
                  if (a.length == 1) return List.of("give", "resetcd");
                  if (a.length == 3 && a[0].equalsIgnoreCase("give")) {
                      List<String> list = new ArrayList<>();
                      for (AspectType t : AspectType.values()) list.add(t.name().toLowerCase());
                      return list;
                  }
                  return List.of();
              }
          }""")

