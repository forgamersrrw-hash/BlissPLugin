          save("resourcepack/assets/minecraft/models/item/nether_star.json", r"""{
            "parent": "minecraft:item/generated",
            "textures": { "layer0": "minecraft:item/nether_star" },
            "overrides": [
              { "predicate": { "custom_model_data": 1001 }, "model": "item/custom/terra_gem" },
              { "predicate": { "custom_model_data": 1002 }, "model": "item/custom/frost_gem" },
              { "predicate": { "custom_model_data": 1003 }, "model": "item/custom/reaper_gem" },
              { "predicate": { "custom_model_data": 1004 }, "model": "item/custom/rage_gem" },
              { "predicate": { "custom_model_data": 1005 }, "model": "item/custom/aegis_gem" },
              { "predicate": { "custom_model_data": 1006 }, "model": "item/custom/bloom_gem" },
              { "predicate": { "custom_model_data": 1007 }, "model": "item/custom/storm_gem" },
              { "predicate": { "custom_model_data": 1008 }, "model": "item/custom/void_gem" },
              { "predicate": { "custom_model_data": 1009 }, "model": "item/custom/phantom_gem" },
              { "predicate": { "custom_model_data": 1010 }, "model": "item/custom/knight_gem" }
            ]
          }""")

          # 1.21.2+ Modern Item Definition System
          save("resourcepack/assets/minecraft/items/nether_star.json", r"""{
            "model": {
              "type": "minecraft:range_dispatch",
              "property": "minecraft:custom_model_data",
              "fallback": { "type": "minecraft:model", "model": "minecraft:item/nether_star" },
              "entries": [
                { "threshold": 1001, "model": { "type": "minecraft:model", "model": "item/custom/terra_gem" } },
                { "threshold": 1002, "model": { "type": "minecraft:model", "model": "item/custom/frost_gem" } },
                { "threshold": 1003, "model": { "type": "minecraft:model", "model": "item/custom/reaper_gem" } },
                { "threshold": 1004, "model": { "type": "minecraft:model", "model": "item/custom/rage_gem" } },
                { "threshold": 1005, "model": { "type": "minecraft:model", "model": "item/custom/aegis_gem" } },
                { "threshold": 1006, "model": { "type": "minecraft:model", "model": "item/custom/bloom_gem" } },
                { "threshold": 1007, "model": { "type": "minecraft:model", "model": "item/custom/storm_gem" } },
                { "threshold": 1008, "model": { "type": "minecraft:model", "model": "item/custom/void_gem" } },
                { "threshold": 1009, "model": { "type": "minecraft:model", "model": "item/custom/phantom_gem" } },
                { "threshold": 1010, "model": { "type": "minecraft:model", "model": "item/custom/knight_gem" } }
              ]
            }
          }""")

          for gem, (col, acc) in gem_colors.items():
              save(f"resourcepack/assets/minecraft/models/item/custom/{gem}_gem.json", f"""{{
                "parent": "minecraft:item/generated",
                "textures": {{ "layer0": "minecraft:item/custom/{gem}_gem" }}
              }}""")
              tex_path = f"resourcepack/assets/minecraft/textures/item/custom/{gem}_gem.png"
              os.makedirs(os.path.dirname(tex_path), exist_ok=True)
              with open(tex_path, "wb") as f:
                  f.write(make_gem_png(col, acc))

          with zipfile.ZipFile("BlissAspects-ResourcePack.zip", 'w', zipfile.ZIP_DEFLATED) as zipf:
              for root, dirs, files in os.walk("resourcepack"):
                  for file in files:
                      full_p = os.path.join(root, file)
                      arc_p = os.path.relpath(full_p, "resourcepack")
                      zipf.write(full_p, arc_p)

      - name: Build with Maven
        run: mvn clean package --batch-mode

      - name: Upload Plugin Jar
        uses: actions/upload-artifact@v4
        with:
          name: BlissAspects-12.0-Plugin
          path: target/BlissAspects.jar

      - name: Upload Texture Pack with Native PNGs
        uses: actions/upload-artifact@v4
        with:
          name: BlissAspects-ResourcePack
          path: BlissAspects-ResourcePack.zip
