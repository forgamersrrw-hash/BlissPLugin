              // MOVE 2: VISUAL SUSTAINED DOMES
              private boolean castMove2(Player p, AspectType a, int tier, double cM) {
                  String k = "m2";
                  double baseCd = cd.getConfigCooldown(a, 2);
                  if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getM2(), k); return false; }
                  cd.setCooldown(p, k, baseCd * cM);

                  World w = p.getWorld(); Location eye = p.getEyeLocation();
                  int duration = 90 + (tier * 15); // Clean 4.5 to 7.5 seconds

                  switch (a) {
                      case TERRA -> {
                          w.playSound(eye, Sound.BLOCK_ANVIL_LAND, 2.5f, 0.6f);
                          p.addPotionEffect(new PotionEffect(PotionEffectType.RESISTANCE, duration, 2));
                          p.addPotionEffect(new PotionEffect(PotionEffectType.ABSORPTION, duration, 2));
                          pl.spawnTask(duration, 2, step -> {
                              BlissAspects.drawDenseDome(p.getLocation(), 3.5, Particle.BLOCK, 5);
                              for (Entity e : p.getNearbyEntities(4.5, 2.5, 4.5)) if (e instanceof LivingEntity tg && tg != p) {
                                  tg.setVelocity(tg.getLocation().toVector().subtract(p.getLocation().toVector()).normalize().multiply(0.7));
                              }
                          });
                      }
                      case FROST -> {
                          w.playSound(eye, Sound.BLOCK_POWDER_SNOW_STEP, 2.5f, 1.4f);
                          p.addPotionEffect(new PotionEffect(PotionEffectType.ABSORPTION, duration, 2));
                          pl.spawnTask(duration, 2, step -> {
                              BlissAspects.drawDenseDome(p.getLocation(), 3.0, Particle.SNOWFLAKE, 4);
                              w.spawnParticle(Particle.END_ROD, p.getLocation().add(0, 1.0, 0), 4, 0.3, 0.5, 0.3, 0.02);
                              for (Entity e : p.getNearbyEntities(3.5, 2.0, 3.5)) if (e instanceof LivingEntity tg && tg != p) {
                                  tg.addPotionEffect(new PotionEffect(PotionEffectType.SLOWNESS, 40, 2));
                              }
                          });
                      }
                      case REAPER -> {
                          p.addPotionEffect(new PotionEffect(PotionEffectType.INVISIBILITY, duration, 0, false, false));
                          p.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, duration, 2, false, false));
                          w.playSound(eye, Sound.ENTITY_PHANTOM_FLAP, 2.5f, 0.5f);
                          pl.spawnTask(duration, 2, step -> {
                              w.spawnParticle(Particle.SQUID_INK, p.getLocation().add(0, 0.8, 0), 30, 0.4, 0.6, 0.4, 0.04);
                              BlissAspects.drawDenseRing(p.getLocation().add(0, 0.2, 0), 1.5, Particle.SOUL_FIRE_FLAME, 24, 2);
                          });
                      }
                      case RAGE -> {
                          p.removePotionEffect(PotionEffectType.SLOWNESS);
                          p.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, duration, 1));
                          p.addPotionEffect(new PotionEffect(PotionEffectType.STRENGTH, duration, 1));
                          w.playSound(eye, Sound.ENTITY_ENDER_DRAGON_GROWL, 2.5f, 1.4f);
                          pl.spawnTask(duration, 2, step -> {
                              Location ploc = p.getLocation();
                              BlissAspects.drawDenseRing(ploc.clone().add(0, 0.2, 0), 1.8, Particle.LAVA, 20, 2);
                              BlissAspects.drawDenseRing(ploc.clone().add(0, 1.2, 0), 1.2, Particle.FLAME, 24, 2);
                              w.spawnParticle(Particle.ANGRY_VILLAGER, ploc.add(0, 1.8, 0), 3, 0.2, 0.2, 0.2);
                          });
                      }
                      case AEGIS -> {
                          p.addPotionEffect(new PotionEffect(PotionEffectType.ABSORPTION, duration, 3));
                          w.playSound(eye, Sound.BLOCK_BEACON_ACTIVATE, 2.5f, 1.8f);
                          pl.spawnTask(duration, 2, step -> {
                              BlissAspects.drawDenseDome(p.getLocation(), 4.2, Particle.TOTEM_OF_UNDYING, 5);
                              w.spawnParticle(Particle.WAX_OFF, p.getLocation().add(0, 1.0, 0), 15, 1.5, 1.5, 1.5);
                              for (Entity e : p.getNearbyEntities(4.5, 4.5, 4.5)) if (e instanceof Projectile proj) {
                                  proj.setVelocity(proj.getVelocity().multiply(-0.9));
                              }
                          });
                      }
                      case BLOOM -> {
                          p.addPotionEffect(new PotionEffect(PotionEffectType.REGENERATION, duration, 2));
                          w.playSound(eye, Sound.ENTITY_ALLAY_ITEM_TAKEN, 2.5f, 0.6f);
                          pl.spawnTask(duration, 2, step -> {
                              BlissAspects.drawDenseDome(p.getLocation(), 3.2, Particle.HAPPY_VILLAGER, 4);
                              w.spawnParticle(Particle.HEART, p.getLocation().add(0, 1.5, 0), 3, 0.4, 0.4, 0.4);
                              p.setHealth(Math.min(p.getMaxHealth(), p.getHealth() + 0.4));
                          });
                      }
                      case STORM -> {
                          p.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, duration, 2));
                          w.playSound(p.getLocation(), Sound.ENTITY_LIGHTNING_BOLT_IMPACT, 2.5f, 1.8f);
                          pl.spawnTask(duration, 2, step -> {
                              BlissAspects.drawDenseRing(p.getLocation().add(0, 0.2, 0), 1.5, Particle.ELECTRIC_SPARK, 32, 3);
                              w.spawnParticle(Particle.ELECTRIC_SPARK, p.getLocation().add(0, 1.0, 0), 20, 0.4, 0.6, 0.4, 0.15);
                          });
                      }
                      case VOID -> {
                          p.setVelocity(eye.getDirection().multiply(-1.8).setY(0.4));
                          w.playSound(eye, Sound.ENTITY_ENDERMAN_TELEPORT, 2.5f, 0.6f);
                          pl.spawnTask(duration, 2, step -> {
                              BlissAspects.drawDenseRing(p.getLocation().add(0, 0.6, 0), 2.4, Particle.PORTAL, 40, 3);
                          });
                      }
                      case PHANTOM -> {
                          ghost.add(p.getUniqueId());
                          p.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, duration, 2));
                          p.addPotionEffect(new PotionEffect(PotionEffectType.INVISIBILITY, duration, 0, false, false));
                          w.playSound(eye, Sound.ENTITY_VEX_CHARGE, 2.5f, 0.7f);
                          pl.spawnTask(duration, 2, step -> {
                              w.spawnParticle(Particle.SOUL, p.getLocation().add(0, 0.8, 0), 20, 0.4, 0.8, 0.4, 0.05);
                              w.spawnParticle(Particle.SQUID_INK, p.getLocation().add(0, 0.2, 0), 15, 0.3, 0.2, 0.3, 0.02);
                          });
                          Bukkit.getScheduler().runTaskLater(pl, () -> ghost.remove(p.getUniqueId()), duration);
                      }
                      case KNIGHT -> {
                          parry.add(p.getUniqueId());
                          w.playSound(eye, Sound.ITEM_SHIELD_BLOCK, 2.5f, 1.3f);
                          pl.spawnTask(duration, 2, step -> {
                              BlissAspects.drawDenseRing(p.getLocation().add(0, 1.0, 0), 2.5, Particle.CRIT, 36, 3);
                          });
                          Bukkit.getScheduler().runTaskLater(pl, () -> parry.remove(p.getUniqueId()), duration);
                      }
                  }
                  return true;
              }

