name: Build BlissAspects

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Plugin Files
        shell: python
        run: |
          import os

          def save(path, text):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text.strip())

          save("pom.xml", r"""<?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.bliss</groupId>
              <artifactId>BlissAspects</artifactId>
              <version>2.5.0</version>
              <packaging>jar</packaging>
              <properties><java.version>21</java.version><project.build.sourceEncoding>UTF-8</project.build.sourceEncoding></properties>
              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>
              <dependencies><dependency><groupId>io.papermc.paper</groupId><artifactId>paper-api</artifactId><version>1.21.1-R0.1-SNAPSHOT</version><scope>provided</scope></dependency></dependencies>
              <build><finalName>BlissAspects</finalName><plugins><plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-compiler-plugin</artifactId><version>3.13.0</version><configuration><source>21</source><target>21</target></configuration></plugin></plugins></build>
          </project>""")

          save("src/main/resources/plugin.yml", r"""name: BlissAspects
          version: 2.5.0
          main: com.bliss.aspects.BlissAspects
          api-version: '1.21'
          commands:
            aspect:
              permission: bliss.use
              description: Bliss Aspect gem command""")

          save("src/main/java/com/bliss/aspects/BlissAspects.java", r"""package com.bliss.aspects;

          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.*;
          import org.bukkit.*;
          import org.bukkit.command.*;
          import org.bukkit.enchantments.Enchantment;
          import org.bukkit.entity.*;
          import org.bukkit.event.*;
          import org.bukkit.event.entity.*;
          import org.bukkit.event.player.PlayerInteractEvent;
          import org.bukkit.inventory.*;
          import org.bukkit.inventory.meta.ItemMeta;
          import org.bukkit.persistence.*;
          import org.bukkit.plugin.java.JavaPlugin;
          import org.bukkit.potion.*;
          import org.bukkit.scheduler.BukkitRunnable;
          import org.bukkit.util.RayTraceResult;
          import java.util.*;

          public final class BlissAspects extends JavaPlugin {
              private CooldownManager cd;
              private GemManager gm;

              @Override
              public void onEnable() {
                  this.cd = new CooldownManager();
                  this.gm = new GemManager(this);
                  getServer().getPluginManager().registerEvents(new AspectListener(this, cd, gm), this);
                  AspectCommand cmd = new AspectCommand(cd, gm);
                  Objects.requireNonNull(getCommand("aspect")).setExecutor(cmd);
                  Objects.requireNonNull(getCommand("aspect")).setTabCompleter(cmd);

                  // Continuous Bliss Passive Effects and Ambient Particles
                  Bukkit.getScheduler().runTaskTimer(this, () -> {
                      for (Player p : Bukkit.getOnlinePlayers()) {
                          ItemStack gem = gm.getWieldedGem(p);
                          if (gem == null) continue;
                          AspectType t = gm.getGemAspect(gem);
                          if (t == null) continue;

                          Location loc = p.getLocation().add(0, 0.6, 0);
                          switch (t) {
                              case STORM -> {
                                  p.getWorld().spawnParticle(Particle.ELECTRIC_SPARK, loc, 3, 0.3, 0.4, 0.3, 0.05);
                                  p.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, 40, 0, false, false, false));
                              }
                              case TERRA -> p.addPotionEffect(new PotionEffect(PotionEffectType.RESISTANCE, 40, 0, false, false, false));
                              case BLOOM -> {
                                  p.getWorld().spawnParticle(Particle.HAPPY_VILLAGER, loc, 3, 0.3, 0.3, 0.3);
                                  p.addPotionEffect(new PotionEffect(PotionEffectType.REGENERATION, 40, 0, false, false, false));
                              }
                              case RAGE -> {
                                  if (p.getHealth() <= p.getMaxHealth() / 2.0) {
                                      p.addPotionEffect(new PotionEffect(PotionEffectType.STRENGTH, 40, 0, false, false, false));
                                      p.getWorld().spawnParticle(Particle.FLAME, loc, 3, 0.2, 0.4, 0.2, 0.02);
                                  }
                              }
                              case VOID -> {
                                  p.getWorld().spawnParticle(Particle.PORTAL, loc, 5, 0.3, 0.4, 0.3);
                                  if (p.getFallDistance() > 3.0f) p.setFallDistance(0);
                              }
                              case PHANTOM -> {
                                  if (p.isSneaking()) p.addPotionEffect(new PotionEffect(PotionEffectType.SLOW_FALLING, 40, 0, false, false, false));
                              }
                              default -> {}
                          }
                      }
                  }, 0L, 20L);
              }
          }

          enum AspectType {
              TERRA("Terra", NamedTextColor.GOLD, "Earthshaker Slam", "Bastion Fortress", "Resistance I & Knockback Resist"),
              FROST("Frost", TextColor.color(0x70D6FF), "Glacial Blizzard", "Frost Slide", "Freeze Immunity & Chilled Aura"),
              REAPER("Reaper", NamedTextColor.DARK_PURPLE, "Soul Siphon Scythe", "Wraith Phase", "Soul Trail & Night Vision"),
              RAGE("Rage", NamedTextColor.RED, "Berserker Cleave", "War Roar", "Strength I when under 50% HP"),
              AEGIS("Aegis", TextColor.color(0xFFD166), "Radiant Judgement", "Divine Sanctuary", "Golden Shield & Absorption"),
              BLOOM("Bloom", NamedTextColor.GREEN, "Thorn Entanglement", "Floral Blossom", "Continuous Regeneration I"),
              STORM("Storm", NamedTextColor.AQUA, "Tempest Bolt", "Lightning Blink", "Continuous Speed I & Spark Aura"),
              VOID("Void", TextColor.color(0x9D4EDD), "Event Horizon Vortex", "Rift Step", "Total Fall Damage Immunity"),
              PHANTOM("Phantom", NamedTextColor.DARK_GRAY, "Shadow Ambush", "Spectral Phase", "Slow Falling when Sneaking"),
              KNIGHT("Knight", NamedTextColor.WHITE, "Shield Bash Rush", "Iron Counter-Parry", "+4 Armor Defense & Poise");

              private final String d, pri, sec, p;
              private final TextColor c;
              AspectType(String d, TextColor c, String pri, String sec, String p) { this.d = d; this.c = c; this.pri = pri; this.sec = sec; this.p = p; }
              public String getDisplayName() { return d; }
              public String getPri() { return pri; }
              public String getSec() { return sec; }
              public String getPassiveDesc() { return p; }
              public Component getFormattedName() { return Component.text(d, c); }
          }

          class CooldownManager {
              private final Map<UUID, Map<String, Long>> cd = new HashMap<>();
              public boolean isOnCooldown(Player p, String k) {
                  var m = cd.get(p.getUniqueId());
                  return m != null && m.containsKey(k) && System.currentTimeMillis() < m.get(k);
              }
              public double getRemaining(Player p, String k) {
                  var m = cd.get(p.getUniqueId());
                  if (m == null || !m.containsKey(k)) return 0;
                  return Math.max(0, (m.get(k) - System.currentTimeMillis()) / 1000.0);
              }
              public void setCooldown(Player p, String k, double s) {
                  cd.computeIfAbsent(p.getUniqueId(), x -> new HashMap<>()).put(k, System.currentTimeMillis() + (long)(s * 1000));
              }
              public void reset(Player p) { cd.remove(p.getUniqueId()); }
              public void notice(Player p, String n, String k) {
                  p.sendActionBar(Component.text(n + " Cooldown: " + String.format("%.1f", getRemaining(p, k)) + "s", NamedTextColor.RED));
              }
          }

          class GemManager {
              private final NamespacedKey ak, kk;
              public GemManager(JavaPlugin pl) {
                  this.ak = new NamespacedKey(pl, "b_asp");
                  this.kk = new NamespacedKey(pl, "b_kls");
              }
              public ItemStack createGem(AspectType a, int kills) {
                  ItemStack it = new ItemStack(Material.NETHER_STAR);
                  updateMeta(it, a, kills);
                  return it;
              }
              public void updateMeta(ItemStack it, AspectType a, int kills) {
                  ItemMeta m = it.getItemMeta();
                  int tier = Math.min(5, kills / 10);
                  m.displayName(Component.text("❖ ", NamedTextColor.WHITE).append(a.getFormattedName().decorate(TextDecoration.BOLD)).append(Component.text(" Soul Gem ❖", NamedTextColor.WHITE)).decoration(TextDecoration.ITALIC, false));
                  m.lore(List.of(
                      Component.text("Tier: ", NamedTextColor.GOLD).append(Component.text("★".repeat(Math.max(1, tier)) + "☆".repeat(Math.max(0, 5 - tier)) + " (Tier " + tier + ")", NamedTextColor.YELLOW)).decoration(TextDecoration.ITALIC, false),
                      Component.text("Harvested Souls: ", NamedTextColor.GRAY).append(Component.text(kills + " / 50", NamedTextColor.AQUA)).decoration(TextDecoration.ITALIC, false),
                      Component.text("━━━━━━━━━━━━━━━━━━━━━━━━━", NamedTextColor.DARK_GRAY).decoration(TextDecoration.ITALIC, false),
                      Component.text("Passive: ", NamedTextColor.BLUE).append(Component.text(a.getPassiveDesc(), NamedTextColor.WHITE)).decoration(TextDecoration.ITALIC, false),
                      Component.text("▶ Right-Click: ", NamedTextColor.GOLD).append(Component.text(a.getPri(), NamedTextColor.YELLOW)).decoration(TextDecoration.ITALIC, false),
                      Component.text("   Offensive strike • Heavy AoE damage", NamedTextColor.GRAY).decoration(TextDecoration.ITALIC, false),
                      Component.text("▶ Shift + Right-Click: ", NamedTextColor.AQUA).append(Component.text(a.getSec(), NamedTextColor.WHITE)).decoration(TextDecoration.ITALIC, false),
                      Component.text("   Evasive escape • Mobility / Defense", NamedTextColor.GRAY).decoration(TextDecoration.ITALIC, false),
                      Component.text("━━━━━━━━━━━━━━━━━━━━━━━━━", NamedTextColor.DARK_GRAY).decoration(TextDecoration.ITALIC, false),
                      Component.text("Attributes: ", NamedTextColor.LIGHT_PURPLE).append(Component.text("+" + (tier * 10) + "% Damage ", NamedTextColor.RED)).append(Component.text("| -" + (tier * 6) + "% Cooldowns", NamedTextColor.GREEN)).decoration(TextDecoration.ITALIC, false),
                      Component.text("Hold in Main Hand or Offhand to wield.", NamedTextColor.DARK_GRAY).decoration(TextDecoration.ITALIC, true)
                  ));
                  m.addEnchant(Enchantment.UNBREAKING, 1, true);
                  m.addItemFlags(ItemFlag.HIDE_ENCHANTS);
                  m.getPersistentDataContainer().set(ak, PersistentDataType.STRING, a.name());
                  m.getPersistentDataContainer().set(kk, PersistentDataType.INTEGER, kills);
                  it.setItemMeta(m);
              }
              public boolean isGem(ItemStack it) {
                  return it != null && it.hasItemMeta() && it.getItemMeta().getPersistentDataContainer().has(ak, PersistentDataType.STRING);
              }
              public AspectType getGemAspect(ItemStack it) {
                  return isGem(it) ? AspectType.valueOf(it.getItemMeta().getPersistentDataContainer().get(ak, PersistentDataType.STRING)) : null;
              }
              public int getGemKills(ItemStack it) {
                  return isGem(it) ? it.getItemMeta().getPersistentDataContainer().getOrDefault(kk, PersistentDataType.INTEGER, 0) : 0;
              }
              public ItemStack getWieldedGem(Player p) {
                  ItemStack main = p.getInventory().getItemInMainHand();
                  if (isGem(main)) return main;
                  ItemStack off = p.getInventory().getItemInOffHand();
                  return isGem(off) ? off : null;
              }
          }

          class AspectListener implements Listener {
              private final JavaPlugin pl;
              private final CooldownManager cd;
              private final GemManager gm;
              private final Set<UUID> parry = new HashSet<>(), ghost = new HashSet<>();

              public AspectListener(JavaPlugin pl, CooldownManager cd, GemManager gm) {
                  this.pl = pl; this.cd = cd; this.gm = gm;
              }

              @EventHandler
              public void onInteract(PlayerInteractEvent e) {
                  Player p = e.getPlayer();
                  ItemStack gem = gm.getWieldedGem(p);
                  if (gem == null || !e.getAction().name().contains("RIGHT")) return;

                  AspectType a = gm.getGemAspect(gem);
                  int kills = gm.getGemKills(gem);
                  int tier = Math.min(5, kills / 10);
                  double dMod = 1.0 + (tier * 0.10);
                  double cMod = Math.max(0.70, 1.0 - (tier * 0.06));

                  if (p.isSneaking()) castSec(p, a, cMod);
                  else castPri(p, a, dMod, cMod);
                  e.setCancelled(true);
              }

              private void castPri(Player p, AspectType a, double dM, double cM) {
                  String k = "pri";
                  World w = p.getWorld();
                  Location eye = p.getEyeLocation();
                  org.bukkit.util.Vector dir = eye.getDirection().normalize();

                  switch (a) {
                      case TERRA -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getPri(), k); return; }
                          cd.setCooldown(p, k, 10 * cM);
                          p.setVelocity(dir.clone().setY(0.7).multiply(1.2));
                          w.playSound(eye, Sound.ENTITY_IRON_GOLEM_ATTACK, 2f, 0.5f);
                          w.spawnParticle(Particle.BLOCK, eye, 60, 0.5, 0.5, 0.5, Material.DIRT.createBlockData());

                          new BukkitRunnable() {
                              int t = 0;
                              public void run() {
                                  if (p.isOnGround() || ++t > 30) {
                                      Location slam = p.getLocation();
                                      w.spawnParticle(Particle.BLOCK, slam, 300, 3.5, 0.5, 3.5, Material.STONE.createBlockData());
                                      w.playSound(slam, Sound.ENTITY_GENERIC_EXPLODE, 2f, 0.6f);
                                      for (Entity e : p.getNearbyEntities(7, 3, 7)) if (e instanceof LivingEntity t && t != p) {
                                          t.damage(8.5 * dM, p);
                                          t.setVelocity(new org.bukkit.util.Vector(0, 0.9, 0));
                                      }
                                      cancel();
                                  }
                              }
                          }.runTaskTimer(pl, 5L, 1L);
                      }
                      case FROST -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getPri(), k); return; }
                          cd.setCooldown(p, k, 8 * cM);
                          w.playSound(eye, Sound.BLOCK_GLASS_BREAK, 2f, 0.6f);
                          for (int i = 1; i <= 10; i++) {
                              Location step = eye.clone().add(dir.clone().multiply(i));
                              w.spawnParticle(Particle.SNOWFLAKE, step, 20, 0.4, 0.4, 0.4, 0.05);
                              for (Entity e : w.getNearbyEntities(step, 1.5, 1.5, 1.5)) if (e instanceof LivingEntity t && t != p) {
                                  t.damage(6.5 * dM, p);
                                  t.setFreezeTicks(300);
                                  t.addPotionEffect(new PotionEffect(PotionEffectType.SLOWNESS, 100, 2));
                              }
                          }
                      }
                      case REAPER -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getPri(), k); return; }
                          cd.setCooldown(p, k, 7 * cM);
                          w.playSound(eye, Sound.ENTITY_WITHER_SHOOT, 1.5f, 1.6f);
                          double st = 0;
                          for (int i = 1; i <= 8; i++) {
                              Location step = eye.clone().add(dir.clone().multiply(i));
                              w.spawnParticle(Particle.SOUL_FIRE_FLAME, step, 15, 0.3, 0.3, 0.3, 0.02);
                              for (Entity e : w.getNearbyEntities(step, 1.5, 1.5, 1.5)) if (e instanceof LivingEntity t && t != p) {
                                  t.damage(7.5 * dM, p);
                                  t.addPotionEffect(new PotionEffect(PotionEffectType.WITHER, 80, 1));
                                  st += 2.5;
                              }
                          }
                          if (st > 0) {
                              p.setHealth(Math.min(p.getMaxHealth(), p.getHealth() + st));
                              w.spawnParticle(Particle.HEART, eye.add(0, 0.5, 0), 8, 0.4, 0.4, 0.4);
                          }
                      }
                      case RAGE -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getPri(), k); return; }
                          cd.setCooldown(p, k, 6 * cM);
                          if (p.getHealth() > 2.0) p.setHealth(p.getHealth() - 2.0);
                          w.playSound(eye, Sound.ENTITY_RAVAGER_ATTACK, 1.8f, 0.9f);
                          w.spawnParticle(Particle.SWEEP_ATTACK, eye.add(dir.multiply(1.5)), 8, 0.5, 0.5, 0.5);
                          w.spawnParticle(Particle.LAVA, eye, 30, 1.2, 0.5, 1.2, 0.1);
                          double dmg = (7.5 + ((1.0 - (p.getHealth() / p.getMaxHealth())) * 10.0)) * dM;
                          for (Entity e : p.getNearbyEntities(5, 2.5, 5)) if (e instanceof LivingEntity t && t != p) t.damage(dmg, p);
                      }
                      case AEGIS -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getPri(), k); return; }
                          cd.setCooldown(p, k, 10 * cM);
                          RayTraceResult r = p.rayTraceBlocks(20);
                          Location tgt = (r != null && r.getHitPosition() != null) ? r.getHitPosition().toLocation(w) : eye.clone().add(dir.clone().multiply(12));
                          w.spawnParticle(Particle.FLASH, tgt, 5);
                          w.spawnParticle(Particle.END_ROD, tgt, 150, 1.0, 6.0, 1.0, 0.1);
                          w.playSound(tgt, Sound.ITEM_TRIDENT_THUNDER, 2f, 1.3f);
                          for (Entity e : w.getNearbyEntities(tgt, 4.5, 4.5, 4.5)) if (e instanceof LivingEntity t && t != p) {
                              t.damage(9.5 * dM, p);
                              t.setFireTicks(100);
                          }
                      }
                      case BLOOM -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getPri(), k); return; }
                          cd.setCooldown(p, k, 7 * cM);
                          w.playSound(eye, Sound.BLOCK_VINE_BREAK, 2f, 0.8f);
                          for (int i = 1; i <= 10; i++) {
                              Location step = eye.clone().add(dir.clone().multiply(i));
                              w.spawnParticle(Particle.HAPPY_VILLAGER, step, 12, 0.3, 0.3, 0.3);
                              for (Entity e : w.getNearbyEntities(step, 1.5, 1.5, 1.5)) if (e instanceof LivingEntity t && t != p) {
                                  t.damage(6.5 * dM, p);
                                  t.setVelocity(eye.toVector().subtract(t.getLocation().toVector()).normalize().multiply(1.1));
                                  t.addPotionEffect(new PotionEffect(PotionEffectType.POISON, 120, 1));
                                  return;
                              }
                          }
                      }
                      case STORM -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getPri(), k); return; }
                          cd.setCooldown(p, k, 8 * cM);
                          RayTraceResult tr = p.rayTraceBlocks(25);
                          Location tgt = (tr != null && tr.getHitPosition() != null) ? tr.getHitPosition().toLocation(w) : eye.clone().add(dir.clone().multiply(15));
                          w.strikeLightningEffect(tgt);
                          w.spawnParticle(Particle.ELECTRIC_SPARK, tgt, 100, 1.0, 2.0, 1.0, 0.2);
                          for (Entity e : w.getNearbyEntities(tgt, 4, 4, 4)) if (e instanceof LivingEntity t && t != p) t.damage(10.0 * dM, p);
                      }
                      case VOID -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getPri(), k); return; }
                          cd.setCooldown(p, k, 12 * cM);
                          RayTraceResult tr = p.rayTraceBlocks(16);
                          Location c = (tr != null && tr.getHitPosition() != null) ? tr.getHitPosition().toLocation(w) : eye.clone().add(dir.clone().multiply(10));
                          w.playSound(c, Sound.BLOCK_BEACON_DEACTIVATE, 2f, 0.5f);

                          new BukkitRunnable() {
                              int ti = 0;
                              public void run() {
                                  w.spawnParticle(Particle.PORTAL, c, 120, 2.0, 2.0, 2.0, 0.5);
                                  for (Entity e : w.getNearbyEntities(c, 8, 8, 8)) if (e instanceof LivingEntity t && t != p) {
                                      t.setVelocity(c.toVector().subtract(t.getLocation().toVector()).normalize().multiply(0.45));
                                  }
                                  if (++ti >= 30) {
                                      w.playSound(c, Sound.ENTITY_WARDEN_SONIC_BOOM, 2f, 1.2f);
                                      w.spawnParticle(Particle.SONIC_BOOM, c, 1);
                                      for (Entity e : w.getNearbyEntities(c, 5, 5, 5)) if (e instanceof LivingEntity t && t != p) t.damage(11.0 * dM, p);
                                      cancel();
                                  }
                              }
                          }.runTaskTimer(pl, 0L, 1L);
                      }
                      case PHANTOM -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getPri(), k); return; }
                          RayTraceResult ry = p.rayTraceEntities(15);
                          if (ry != null && ry.getHitEntity() instanceof LivingEntity tg && tg != p) {
                              cd.setCooldown(p, k, 10 * cM);
                              Location bh = tg.getLocation().subtract(tg.getLocation().getDirection().normalize().multiply(1.5));
                              bh.setDirection(tg.getLocation().subtract(bh).toVector());
                              p.teleport(bh);
                              tg.damage(8.5 * dM, p);
                              tg.addPotionEffect(new PotionEffect(PotionEffectType.DARKNESS, 80, 1));
                              w.spawnParticle(Particle.SQUID_INK, bh, 50, 0.5, 1, 0.5, 0.05);
                              w.playSound(bh, Sound.ENTITY_PLAYER_ATTACK_CRIT, 1.5f, 0.7f);
                          } else {
                              p.sendActionBar(Component.text("Aim at a target to Ambush!", NamedTextColor.GRAY));
                          }
                      }
                      case KNIGHT -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getPri(), k); return; }
                          cd.setCooldown(p, k, 7 * cM);
                          p.setVelocity(dir.clone().setY(0.15).multiply(2.0));
                          w.playSound(eye, Sound.ITEM_ARMOR_EQUIP_NETHERITE, 2f, 0.7f);

                          new BukkitRunnable() {
                              int rt = 0;
                              public void run() {
                                  w.spawnParticle(Particle.CRIT, p.getLocation().add(0, 0.8, 0), 10, 0.4, 0.4, 0.4, 0.05);
                                  for (Entity e : p.getNearbyEntities(1.8, 1.8, 1.8)) if (e instanceof LivingEntity t && t != p) {
                                      t.damage(7.5 * dM, p);
                                      t.setVelocity(p.getLocation().getDirection().multiply(1.5).setY(0.4));
                                      w.playSound(t.getLocation(), Sound.ITEM_SHIELD_BLOCK, 1.8f, 0.6f);
                                      cancel(); return;
                                  }
                                  if (++rt > 15) cancel();
                              }
                          }.runTaskTimer(pl, 1L, 1L);
                      }
                  }
              }

              private void castSec(Player p, AspectType a, double cM) {
                  String k = "sec";
                  World w = p.getWorld();
                  Location eye = p.getEyeLocation();
                  org.bukkit.util.Vector dir = eye.getDirection().normalize();

                  switch (a) {
                      case TERRA -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getSec(), k); return; }
                          cd.setCooldown(p, k, 14 * cM);
                          p.addPotionEffect(new PotionEffect(PotionEffectType.RESISTANCE, 120, 2));
                          p.addPotionEffect(new PotionEffect(PotionEffectType.ABSORPTION, 160, 1));
                          w.playSound(eye, Sound.BLOCK_ANVIL_LAND, 2f, 0.6f);
                          w.spawnParticle(Particle.BLOCK, p.getLocation().add(0, 0.5, 0), 180, 2.5, 1.0, 2.5, Material.STONE.createBlockData());
                      }
                      case FROST -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getSec(), k); return; }
                          cd.setCooldown(p, k, 7 * cM);
                          p.setVelocity(dir.clone().setY(0.15).multiply(1.8));
                          w.playSound(eye, Sound.BLOCK_POWDER_SNOW_STEP, 2f, 1.5f);
                          w.spawnParticle(Particle.SNOWFLAKE, eye, 60, 0.6, 0.6, 0.6, 0.05);
                      }
                      case REAPER -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getSec(), k); return; }
                          cd.setCooldown(p, k, 12 * cM);
                          p.addPotionEffect(new PotionEffect(PotionEffectType.INVISIBILITY, 80, 0, false, false));
                          p.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, 80, 2, false, false));
                          w.playSound(eye, Sound.ENTITY_PHANTOM_FLAP, 2f, 0.5f);
                          w.spawnParticle(Particle.SQUID_INK, eye, 50, 0.5, 0.8, 0.5, 0.05);
                      }
                      case RAGE -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getSec(), k); return; }
                          cd.setCooldown(p, k, 12 * cM);
                          p.removePotionEffect(PotionEffectType.SLOWNESS);
                          p.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, 140, 1));
                          p.addPotionEffect(new PotionEffect(PotionEffectType.STRENGTH, 120, 0));
                          w.playSound(eye, Sound.ENTITY_ENDER_DRAGON_GROWL, 1.5f, 1.5f);
                          w.spawnParticle(Particle.ANGRY_VILLAGER, eye, 25, 0.6, 0.6, 0.6);
                      }
                      case AEGIS -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getSec(), k); return; }
                          cd.setCooldown(p, k, 16 * cM);
                          p.addPotionEffect(new PotionEffect(PotionEffectType.ABSORPTION, 180, 1));
                          w.playSound(eye, Sound.BLOCK_BEACON_ACTIVATE, 2f, 1.8f);
                          w.spawnParticle(Particle.TOTEM_OF_UNDYING, eye, 100, 1.5, 1.5, 1.5, 0.2);
                      }
                      case BLOOM -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getSec(), k); return; }
                          cd.setCooldown(p, k, 13 * cM);
                          p.addPotionEffect(new PotionEffect(PotionEffectType.REGENERATION, 140, 1));
                          p.setHealth(Math.min(p.getMaxHealth(), p.getHealth() + 4.0));
                          w.playSound(eye, Sound.ENTITY_ALLAY_ITEM_TAKEN, 2f, 0.6f);
                          w.spawnParticle(Particle.SPORE_BLOSSOM_AIR, eye, 200, 2.5, 1.5, 2.5);
                          w.spawnParticle(Particle.HEART, eye.add(0, 0.5, 0), 10, 0.5, 0.5, 0.5);
                      }
                      case STORM -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getSec(), k); return; }
                          cd.setCooldown(p, k, 8 * cM);
                          Location to = eye.clone().add(dir.clone().multiply(9));
                          if (to.getBlock().isPassable()) p.teleport(to);
                          w.playSound(p.getLocation(), Sound.ENTITY_LIGHTNING_BOLT_IMPACT, 1.5f, 1.8f);
                          w.spawnParticle(Particle.ELECTRIC_SPARK, p.getLocation().add(0, 1, 0), 70, 0.6, 1.0, 0.6, 0.1);
                      }
                      case VOID -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getSec(), k); return; }
                          cd.setCooldown(p, k, 9 * cM);
                          p.setVelocity(dir.clone().multiply(-1.5).setY(0.35));
                          w.playSound(eye, Sound.ENTITY_ENDERMAN_TELEPORT, 1.8f, 0.6f);
                          w.spawnParticle(Particle.PORTAL, eye, 80, 0.8, 0.8, 0.8, 0.2);
                      }
                      case PHANTOM -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getSec(), k); return; }
                          cd.setCooldown(p, k, 18 * cM);
                          ghost.add(p.getUniqueId());
                          p.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, 60, 1));
                          w.playSound(eye, Sound.ENTITY_VEX_CHARGE, 1.8f, 0.7f);
                          w.spawnParticle(Particle.SOUL, eye, 50, 0.5, 0.8, 0.5, 0.05);
                          Bukkit.getScheduler().runTaskLater(pl, () -> ghost.remove(p.getUniqueId()), 60L);
                      }
                      case KNIGHT -> {
                          if (cd.isOnCooldown(p, k)) { cd.notice(p, a.getSec(), k); return; }
                          cd.setCooldown(p, k, 10 * cM);
                          parry.add(p.getUniqueId());
                          w.playSound(eye, Sound.ITEM_SHIELD_BLOCK, 1.8f, 1.3f);
                          w.spawnParticle(Particle.CRIT, eye, 30, 0.4, 0.4, 0.4, 0.1);
                          Bukkit.getScheduler().runTaskLater(pl, () -> parry.remove(p.getUniqueId()), 35L);
                      }
                  }
              }

              @EventHandler
              public void onKill(EntityDeathEvent e) {
                  Player k = e.getEntity().getKiller();
                  if (k == null) return;
                  ItemStack gem = gm.getWieldedGem(k);
                  if (gem == null) return;

                  AspectType a = gm.getGemAspect(gem);
                  int kills = gm.getGemKills(gem);
                  int newKills = kills + (e.getEntity() instanceof Player ? 5 : 1);
                  gm.updateMeta(gem, a, newKills);

                  if (newKills / 10 > kills / 10) {
                      k.sendMessage(Component.text("★ Your " + a.getDisplayName() + " Gem upgraded to Tier " + (newKills / 10) + "! ★", NamedTextColor.GOLD));
                      k.playSound(k.getLocation(), Sound.UI_TOAST_CHALLENGE_COMPLETE, 1.5f, 1.2f);
                  }
              }

              @EventHandler
              public void onDamage(EntityDamageByEntityEvent e) {
                  if (e.getEntity() instanceof Player v && ghost.contains(v.getUniqueId())) {
                      e.setCancelled(true); return;
                  }
                  if (e.getEntity() instanceof Player def && parry.contains(def.getUniqueId())) {
                      e.setCancelled(true);
                      parry.remove(def.getUniqueId());
                      def.getWorld().playSound(def.getLocation(), Sound.BLOCK_ANVIL_PLACE, 1.5f, 1.8f);
                      def.addPotionEffect(new PotionEffect(PotionEffectType.STRENGTH, 80, 1));
                      if (e.getDamager() instanceof LivingEntity atk) atk.damage(6.0, def);
                  }
              }
          }

          class AspectCommand implements CommandExecutor, TabCompleter {
              private final CooldownManager cd;
              private final GemManager gm;
              public AspectCommand(CooldownManager cd, GemManager gm) { this.cd = cd; this.gm = gm; }

              public boolean onCommand(CommandSender s, Command c, String l, String[] a) {
                  if (a.length == 0 || a[0].equalsIgnoreCase("info")) {
                      if (!(s instanceof Player p)) return true;
                      ItemStack gem = gm.getWieldedGem(p);
                      if (gem != null) {
                          s.sendMessage(Component.text("Holding: ", NamedTextColor.GOLD).append(gm.getGemAspect(gem).getFormattedName()));
                          s.sendMessage(Component.text("Souls: " + gm.getGemKills(gem), NamedTextColor.AQUA));
                      } else s.sendMessage(Component.text("Hold an Aspect Gem in your hand to view stats!", NamedTextColor.GRAY));
                      return true;
                  }
                  if (a[0].equalsIgnoreCase("give") && s.hasPermission("bliss.admin")) {
                      if (a.length < 3) return false;
                      Player target = Bukkit.getPlayer(a[1]);
                      if (target == null) return true;
                      try {
                          AspectType t = AspectType.valueOf(a[2].toUpperCase());
                          int k = a.length >= 4 ? Integer.parseInt(a[3]) : 0;
                          target.getInventory().addItem(gm.createGem(t, k));
                          s.sendMessage(Component.text("Gave " + t.getDisplayName() + " Gem to " + target.getName(), NamedTextColor.GREEN));
                      } catch (Exception ex) { s.sendMessage(Component.text("Invalid aspect type.", NamedTextColor.RED)); }
                      return true;
                  }
                  if (a[0].equalsIgnoreCase("resetcd") && s.hasPermission("bliss.admin")) {
                      Player target = a.length > 1 ? Bukkit.getPlayer(a[1]) : (s instanceof Player p ? p : null);
                      if (target != null) { cd.reset(target); s.sendMessage(Component.text("Cooldowns reset!", NamedTextColor.GREEN)); }
                      return true;
                  }
                  return true;
              }

              public List<String> onTabComplete(CommandSender s, Command c, String al, String[] a) {
                  if (a.length == 1) return List.of("give", "resetcd", "info");
                  if (a.length == 3 && a[0].equalsIgnoreCase("give")) {
                      List<String> list = new ArrayList<>();
                      for (AspectType t : AspectType.values()) list.add(t.name().toLowerCase());
                      return list;
                  }
                  return List.of();
              }
          }""")

      - name: Build with Maven
        run: mvn clean package --batch-mode

      - name: Upload Finished Jar
        uses: actions/upload-artifact@v4
        with:
          name: BlissAspects-2.5-Plugin
          path: target/BlissAspects.jar
