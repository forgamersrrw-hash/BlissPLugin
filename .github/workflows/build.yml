                  World w = p.getWorld(); Location eye = p.getEyeLocation();
                  Vector dir = eye.getDirection().normalize();

                  switch (a) {
                      case TERRA -> {
                          p.setVelocity(dir.clone().setY(0.75).multiply(1.3));
                          w.playSound(eye, Sound.ENTITY_IRON_GOLEM_ATTACK, 2f, 0.5f);
                          new BukkitRunnable() {
                              int t = 0;
                              public void run() {
                                  if (p.isOnGround() || ++t > 30) {
                                      Location slam = p.getLocation();
                                      w.playSound(slam, Sound.ENTITY_GENERIC_EXPLODE, 2.5f, 0.5f);
                                      w.spawnParticle(Particle.EXPLOSION, slam.clone().add(0, 0.5, 0), 4);
                                      pl.spawnTask(50 + (tier * 10), 2, step -> {
                                          double r = 1.0 + (step * 0.15);
                                          BlissAspects.drawDenseRing(slam, r, Particle.BLOCK, 48, 3);
                                          for (Entity e : slam.getWorld().getNearbyEntities(slam, r, 2.5, r)) if (e instanceof LivingEntity tg && tg != p) {
                                              tg.damage(applyExecute(tg, 2.5 * dM, tier), p);
                                              tg.setVelocity(new Vector(0, 0.35, 0));
                                          }
                                      });
                                      cancel();
                                  }
                              }
                          }.runTaskTimer(pl, 5L, 1L);
                      }
                      case FROST -> {
                          w.playSound(eye, Sound.BLOCK_GLASS_BREAK, 2.5f, 0.5f);
                          w.playSound(eye, Sound.ENTITY_PLAYER_HURT_FREEZE, 2f, 1.5f);
                          BlissAspects.drawHelixBeam(eye, dir, 16.0, Particle.SNOWFLAKE, Particle.END_ROD);
                          for (int i = 1; i <= 16; i++) {
                              Location pt = eye.clone().add(dir.clone().multiply(i));
                              w.spawnParticle(Particle.CLOUD, pt, 8, 0.4, 0.4, 0.4, 0.05);
                              for (Entity e : w.getNearbyEntities(pt, 2.0, 2.0, 2.0)) if (e instanceof LivingEntity tg && tg != p) {
                                  tg.damage(applyExecute(tg, 7.5 * dM, tier), p);
                                  tg.setFreezeTicks(350);
                                  tg.addPotionEffect(new PotionEffect(PotionEffectType.SLOWNESS, 80, 2));
                              }
                          }
                      }
                      case REAPER -> {
                          w.playSound(eye, Sound.ENTITY_WITHER_SHOOT, 2f, 1.4f);
                          BlissAspects.drawHelixBeam(eye, dir, 14.0, Particle.SOUL_FIRE_FLAME, Particle.SCULK_SOUL);
                          pl.spawnTask(50 + (tier * 10), 2, step -> {
                              Location arcLoc = eye.clone().add(dir.clone().multiply(step * 0.4));
                              BlissAspects.drawDenseRing(arcLoc, 2.0, Particle.SOUL_FIRE_FLAME, 32, 2);
                              double stolen = 0;
                              for (Entity e : arcLoc.getWorld().getNearbyEntities(arcLoc, 2.5, 2.5, 2.5)) if (e instanceof LivingEntity tg && tg != p) {
                                  tg.damage(applyExecute(tg, 2.5 * dM, tier), p);
                                  tg.addPotionEffect(new PotionEffect(PotionEffectType.WITHER, 80, 1));
                                  stolen += 1.8;
                              }
                              if (stolen > 0) p.setHealth(Math.min(p.getMaxHealth(), p.getHealth() + stolen));
                          });
                      }
                      case RAGE -> {
                          if (p.getHealth() > 2.0) p.setHealth(p.getHealth() - 2.0);
                          w.playSound(eye, Sound.ENTITY_RAVAGER_ATTACK, 2.5f, 0.8f);
                          Location start = eye.clone();
                          pl.spawnTask(50 + (tier * 10), 2, step -> {
                              Location wave = start.clone().add(dir.clone().multiply(step * 0.45));
                              BlissAspects.drawDenseRing(wave, 2.5, Particle.LAVA, 24, 2);
                              w.spawnParticle(Particle.FLAME, wave, 40, 0.6, 0.6, 0.6, 0.1);
                              w.spawnParticle(Particle.SWEEP_ATTACK, wave, 4, 0.4, 0.4, 0.4);
                              for (Entity e : wave.getWorld().getNearbyEntities(wave, 3.0, 2.5, 3.0)) if (e instanceof LivingEntity tg && tg != p) {
                                  tg.damage(applyExecute(tg, 3.5 * dM, tier), p);
                                  tg.setFireTicks(100);
                              }
                          });
                      }
                      case AEGIS -> {
                          RayTraceResult r = p.rayTraceBlocks(24);
                          Location tgt = (r != null && r.getHitPosition() != null) ? r.getHitPosition().toLocation(w) : eye.clone().add(dir.clone().multiply(14));
                          w.playSound(tgt, Sound.ITEM_TRIDENT_THUNDER, 2.5f, 1.2f);
                          pl.spawnTask(60 + (tier * 10), 2, step -> {
                              BlissAspects.drawDenseRing(tgt.clone().add(0, (step % 20) * 0.4, 0), 2.2, Particle.END_ROD, 36, 2);
                              w.spawnParticle(Particle.FLASH, tgt.clone().add(0, 1.0, 0), 3);
                              for (Entity e : tgt.getWorld().getNearbyEntities(tgt, 4.5, 6.0, 4.5)) if (e instanceof LivingEntity tg && tg != p) {
                                  tg.damage(applyExecute(tg, 2.8 * dM, tier), p);
                                  tg.setFireTicks(80);
                              }
                          });
                      }
                      case BLOOM -> {
                          w.playSound(eye, Sound.BLOCK_VINE_BREAK, 2.5f, 0.7f);
                          BlissAspects.drawHelixBeam(eye, dir, 14.0, Particle.HAPPY_VILLAGER, Particle.POOF);
                          pl.spawnTask(50 + (tier * 10), 2, step -> {
                              Location vine = eye.clone().add(dir.clone().multiply(step * 0.4));
                              BlissAspects.drawDenseRing(vine, 1.8, Particle.HAPPY_VILLAGER, 28, 2);
                              for (Entity e : vine.getWorld().getNearbyEntities(vine, 2.4, 2.4, 2.4)) if (e instanceof LivingEntity tg && tg != p) {
                                  tg.damage(applyExecute(tg, 2.5 * dM, tier), p);
                                  tg.addPotionEffect(new PotionEffect(PotionEffectType.POISON, 100, 1));
                                  tg.addPotionEffect(new PotionEffect(PotionEffectType.SLOWNESS, 40, 2));
                              }
                          });
                      }
                      case STORM -> {
                          RayTraceResult tr = p.rayTraceBlocks(26);
                          Location tgt = (tr != null && tr.getHitPosition() != null) ? tr.getHitPosition().toLocation(w) : eye.clone().add(dir.clone().multiply(16));
                          w.playSound(tgt, Sound.ENTITY_LIGHTNING_BOLT_THUNDER, 2.5f, 1.4f);
                          pl.spawnTask(60 + (tier * 10), 3, step -> {
                              w.strikeLightningEffect(tgt);
                              BlissAspects.drawDenseRing(tgt, 4.0, Particle.ELECTRIC_SPARK, 48, 4);
                              w.spawnParticle(Particle.FLASH, tgt.clone().add(0, 1.0, 0), 2);
                              for (Entity e : tgt.getWorld().getNearbyEntities(tgt, 5.5, 4.0, 5.5)) if (e instanceof LivingEntity tg && tg != p) {
                                  tg.damage(applyExecute(tg, 4.0 * dM, tier), p);
                              }
                          });
                      }
                      case VOID -> {
                          RayTraceResult tr = p.rayTraceBlocks(20);
                          Location c = (tr != null && tr.getHitPosition() != null) ? tr.getHitPosition().toLocation(w) : eye.clone().add(dir.clone().multiply(12));
                          w.playSound(c, Sound.BLOCK_BEACON_DEACTIVATE, 2.5f, 0.5f);
                          pl.spawnTask(70 + (tier * 10), 2, step -> {
                              double spin = (step * 0.2);
                              BlissAspects.drawDenseRing(c.clone().add(0, Math.sin(spin) * 0.5, 0), 3.5, Particle.PORTAL, 48, 3);
                              BlissAspects.drawDenseRing(c.clone().add(0, -Math.sin(spin) * 0.5, 0), 1.8, Particle.REVERSE_PORTAL, 28, 2);
                              for (Entity e : c.getWorld().getNearbyEntities(c, 7.5, 5.0, 7.5)) if (e instanceof LivingEntity tg && tg != p) {
                                  tg.setVelocity(c.toVector().subtract(tg.getLocation().toVector()).normalize().multiply(0.55));
                                  tg.damage(applyExecute(tg, 2.0 * dM, tier), p);
                              }
                          });
                      }
                      case PHANTOM -> {
                          RayTraceResult ry = p.rayTraceEntities(16);
                          if (ry != null && ry.getHitEntity() instanceof LivingEntity tg && tg != p) {
                              Location bh = tg.getLocation().subtract(tg.getLocation().getDirection().normalize().multiply(1.5));
                              bh.setDirection(tg.getLocation().subtract(bh).toVector());
                              p.teleport(bh);
                              w.playSound(bh, Sound.ENTITY_PLAYER_ATTACK_CRIT, 2f, 0.7f);
                              tg.damage(applyExecute(tg, 10.0 * dM, tier), p);
                              tg.addPotionEffect(new PotionEffect(PotionEffectType.DARKNESS, 120, 1));
                              BlissAspects.drawDenseDome(bh, 2.5, Particle.SQUID_INK, 4);
                              w.spawnParticle(Particle.CRIT, bh.clone().add(0, 1.0, 0), 60, 0.5, 0.5, 0.5, 0.3);
