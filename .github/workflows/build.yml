name: Build BlissAspects

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Plugin Files
        run: |
          mkdir -p src/main/resources src/main/java/com/bliss/aspects

          cat << 'EOF' > pom.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.bliss</groupId>
              <artifactId>BlissAspects</artifactId>
              <version>2.0.0</version>
              <packaging>jar</packaging>
              <properties>
                  <java.version>21</java.version>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>
              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>
              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.21.1-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>
              <build>
                  <finalName>BlissAspects</finalName>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <source>21</source>
                              <target>21</target>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF

          cat << 'EOF' > src/main/resources/plugin.yml
          name: BlissAspects
          version: 2.0.0
          main: com.bliss.aspects.BlissAspects
          api-version: '1.21'
          commands:
            aspect:
              permission: bliss.use
              description: Bliss Aspect gem command
          EOF

          cat << 'EOF' > src/main/java/com/bliss/aspects/AspectType.java
          package com.bliss.aspects;

          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.NamedTextColor;
          import net.kyori.adventure.text.format.TextColor;

          public enum AspectType {
              TERRA("Terra", NamedTextColor.GOLD, "Earth mastery: Seismic shockwaves & Bastion shields.", "Permanent Resistance I & high knockback defense."),
              FROST("Frost", TextColor.color(0x70D6FF), "Glacial freeze: Blizzard slow & freezing dashes.", "Immune to freezing; chills nearby attackers."),
              REAPER("Reaper", NamedTextColor.DARK_PURPLE, "Decay & Harvest: Soul siphon scythe & Wraith phasing.", "Soul trails & bonus night vision."),
              RAGE("Rage", NamedTextColor.RED, "Berserker fury: High missing-health cleaves & war roars.", "Permanent Strength I when under 50% health."),
              AEGIS("Aegis", TextColor.color(0xFFD166), "Divine light: Retribution beams & projectile shields.", "Radiant aura that absorbs damage."),
              BLOOM("Bloom", NamedTextColor.GREEN, "Flora vitality: Poison lash roots & healing clouds.", "Constant Regeneration I while wielded."),
              STORM("Storm", NamedTextColor.AQUA, "Electric mobility: Instant lightning dashes & thunderbolts.", "Constant Speed I & electric spark aura."),
              VOID("Void", TextColor.color(0x7B2CBF), "Cosmic gravity: Black hole singularities & space warps.", "Total immunity to fall damage."),
              PHANTOM("Phantom", NamedTextColor.DARK_GRAY, "Shadows: Blindness ambushes & ethereal intangibility.", "Slow falling on sneak & cloaked presence."),
              KNIGHT("Knight", NamedTextColor.WHITE, "Honor: Shield charges & counter-attack parries.", "Bonus armor defense & reduced knockback.");

              private final String displayName;
              private final TextColor color;
              private final String description;
              private final String passiveDesc;

              AspectType(String displayName, TextColor color, String description, String passiveDesc) {
                  this.displayName = displayName;
                  this.color = color;
                  this.description = description;
                  this.passiveDesc = passiveDesc;
              }

              public String getDisplayName() { return displayName; }
              public TextColor getColor() { return color; }
              public String getDescription() { return description; }
              public String getPassiveDesc() { return passiveDesc; }

              public Component getFormattedName() {
                  return Component.text(displayName, color);
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/bliss/aspects/CooldownManager.java
          package com.bliss.aspects;

          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.NamedTextColor;
          import org.bukkit.entity.Player;
          import java.util.*;

          public class CooldownManager {
              private final Map<UUID, Map<String, Long>> cooldowns = new HashMap<>();

              public boolean isOnCooldown(Player player, String abilityKey) {
                  Map<String, Long> pCds = cooldowns.get(player.getUniqueId());
                  if (pCds == null) return false;
                  Long exp = pCds.get(abilityKey);
                  return exp != null && System.currentTimeMillis() < exp;
              }

              public double getRemainingSeconds(Player player, String abilityKey) {
                  Map<String, Long> pCds = cooldowns.get(player.getUniqueId());
                  if (pCds == null) return 0;
                  Long exp = pCds.get(abilityKey);
                  if (exp == null) return 0;
                  long diff = exp - System.currentTimeMillis();
                  return diff > 0 ? (diff / 1000.0) : 0;
              }

              public void setCooldown(Player player, String abilityKey, double seconds) {
                  cooldowns.computeIfAbsent(player.getUniqueId(), k -> new HashMap<>())
                          .put(abilityKey, System.currentTimeMillis() + (long)(seconds * 1000));
              }

              public void resetCooldowns(Player player) {
                  cooldowns.remove(player.getUniqueId());
              }

              public void sendCooldownNotice(Player player, String name, String key) {
                  double rem = getRemainingSeconds(player, key);
                  player.sendActionBar(Component.text(name + " Cooldown: " + String.format("%.1f", rem) + "s", NamedTextColor.RED));
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/bliss/aspects/GemManager.java
          package com.bliss.aspects;

          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.NamedTextColor;
          import net.kyori.adventure.text.format.TextDecoration;
          import org.bukkit.Material;
          import org.bukkit.NamespacedKey;
          import org.bukkit.enchantments.Enchantment;
          import org.bukkit.inventory.ItemFlag;
          import org.bukkit.inventory.ItemStack;
          import org.bukkit.inventory.meta.ItemMeta;
          import org.bukkit.persistence.PersistentDataContainer;
          import org.bukkit.persistence.PersistentDataType;
          import java.util.ArrayList;
          import java.util.List;

          public class GemManager {
              private final NamespacedKey gemAspectKey;
              private final NamespacedKey gemKillsKey;

              public GemManager(BlissAspects plugin) {
                  this.gemAspectKey = new NamespacedKey(plugin, "bliss_gem_aspect");
                  this.gemKillsKey = new NamespacedKey(plugin, "bliss_gem_kills");
              }

              public ItemStack createGem(AspectType aspect, int initialKills) {
                  ItemStack item = new ItemStack(Material.NETHER_STAR);
                  updateGemMeta(item, aspect, initialKills);
                  return item;
              }

              public void updateGemMeta(ItemStack item, AspectType aspect, int kills) {
                  ItemMeta meta = item.getItemMeta();
                  int tier = Math.min(5, kills / 10);
                  double bonusDmg = tier * 10.0;
                  double cdr = tier * 6.0;

                  meta.displayName(Component.text("✦ ", NamedTextColor.WHITE)
                          .append(aspect.getFormattedName().decorate(TextDecoration.BOLD))
                          .append(Component.text(" Soul Gem ✦", NamedTextColor.WHITE))
                          .decoration(TextDecoration.ITALIC, false));

                  List<Component> lore = new ArrayList<>();
                  lore.add(Component.text(aspect.getDescription(), NamedTextColor.GRAY).decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.empty());
                  lore.add(Component.text("Tier: ", NamedTextColor.GOLD)
                          .append(Component.text("★".repeat(Math.max(1, tier)) + (tier == 5 ? " (MAX)" : ""), NamedTextColor.YELLOW))
                          .decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.text("Souls Harvested: ", NamedTextColor.GRAY)
                          .append(Component.text(kills + " kills", NamedTextColor.AQUA))
                          .decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.empty());
                  lore.add(Component.text("Passive: ", NamedTextColor.BLUE)
                          .append(Component.text(aspect.getPassiveDesc(), NamedTextColor.WHITE))
                          .decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.text("▶ Right-Click: ", NamedTextColor.RED)
                          .append(Component.text("Primary Strike (Attack / Burst)", NamedTextColor.WHITE))
                          .decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.text("▶ Shift + Right-Click: ", NamedTextColor.GREEN)
                          .append(Component.text("Secondary Skill (Evasive / Utility)", NamedTextColor.WHITE))
                          .decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.empty());
                  lore.add(Component.text("Attributes:", NamedTextColor.DARK_PURPLE).decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.text(" • Damage Boost: ", NamedTextColor.DARK_GRAY)
                          .append(Component.text("+" + (int)bonusDmg + "%", NamedTextColor.RED))
                          .decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.text(" • Cooldown Speed: ", NamedTextColor.DARK_GRAY)
                          .append(Component.text("-" + (int)cdr + "%", NamedTextColor.GREEN))
                          .decoration(TextDecoration.ITALIC, false));
                  lore.add(Component.empty());
                  lore.add(Component.text("Hold in Main Hand or Offhand to wield.", NamedTextColor.DARK_GRAY).decoration(TextDecoration.ITALIC, true));

                  meta.lore(lore);
                  meta.addEnchant(Enchantment.UNBREAKING, 1, true);
                  meta.addItemFlags(ItemFlag.HIDE_ENCHANTS);

                  PersistentDataContainer pdc = meta.getPersistentDataContainer();
                  pdc.set(gemAspectKey, PersistentDataType.STRING, aspect.name());
                  pdc.set(gemKillsKey, PersistentDataType.INTEGER, kills);

                  item.setItemMeta(meta);
              }

              public boolean isGem(ItemStack item) {
                  if (item == null || !item.hasItemMeta()) return false;
                  return item.getItemMeta().getPersistentDataContainer().has(gemAspectKey, PersistentDataType.STRING);
              }

              public AspectType getGemAspect(ItemStack item) {
                  if (!isGem(item)) return null;
                  String val = item.getItemMeta().getPersistentDataContainer().get(gemAspectKey, PersistentDataType.STRING);
                  return val != null ? AspectType.valueOf(val) : null;
              }

              public int getGemKills(ItemStack item) {
                  if (!isGem(item)) return 0;
                  return item.getItemMeta().getPersistentDataContainer().getOrDefault(gemKillsKey, PersistentDataType.INTEGER, 0);
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/bliss/aspects/AspectListener.java
          package com.bliss.aspects;

          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.NamedTextColor;
          import org.bukkit.*;
          import org.bukkit.entity.*;
          import org.bukkit.event.EventHandler;
          import org.bukkit.event.Listener;
          import org.bukkit.event.block.Action;
          import org.bukkit.event.entity.EntityDamageByEntityEvent;
          import org.bukkit.event.entity.EntityDeathEvent;
          import org.bukkit.event.player.PlayerInteractEvent;
          import org.bukkit.inventory.EquipmentSlot;
          import org.bukkit.inventory.ItemStack;
          import org.bukkit.potion.PotionEffect;
          import org.bukkit.potion.PotionEffectType;
          import org.bukkit.scheduler.BukkitRunnable;
          import org.bukkit.util.RayTraceResult;
          import org.bukkit.util.Vector;
          import java.util.*;

          public class AspectListener implements Listener {
              private final BlissAspects plugin;
              private final CooldownManager cd;
              private final GemManager gm;
              private final Set<UUID> parryingPlayers = new HashSet<>();
              private final Set<UUID> etherealPlayers = new HashSet<>();

              public AspectListener(BlissAspects plugin) {
                  this.plugin = plugin;
                  this.cd = plugin.getCooldownManager();
                  this.gm = plugin.getGemManager();
              }

              private ItemStack getWieldedGem(Player player) {
                  ItemStack main = player.getInventory().getItemInMainHand();
                  if (gm.isGem(main)) return main;
                  ItemStack off = player.getInventory().getItemInOffHand();
                  if (gm.isGem(off)) return off;
                  return null;
              }

              @EventHandler
              public void onInteract(PlayerInteractEvent event) {
                  if (event.getHand() != EquipmentSlot.HAND) return;
                  Player player = event.getPlayer();
                  ItemStack gem = getWieldedGem(player);
                  if (gem == null) return;

                  AspectType aspect = gm.getGemAspect(gem);
                  int kills = gm.getGemKills(gem);
                  int tier = Math.min(5, kills / 10);
                  double dmgMod = 1.0 + (tier * 0.10);
                  double cdMod = Math.max(0.70, 1.0 - (tier * 0.06));

                  Action action = event.getAction();
                  boolean rightClick = (action == Action.RIGHT_CLICK_AIR || action == Action.RIGHT_CLICK_BLOCK);
                  if (!rightClick) return;

                  if (player.isSneaking()) {
                      triggerSecondary(player, aspect, cdMod);
                      event.setCancelled(true);
                  } else {
                      triggerPrimary(player, aspect, dmgMod, cdMod);
                      event.setCancelled(true);
                  }
              }

              private void triggerPrimary(Player player, AspectType aspect, double dmgMod, double cdMod) {
                  String key = "primary";
                  World w = player.getWorld();

                  switch (aspect) {
                      case TERRA -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Seismic Slam", key); return; }
                          cd.setCooldown(player, key, 10 * cdMod);
                          player.setVelocity(player.getLocation().getDirection().setY(0.4).normalize().multiply(1.3));
                          w.playSound(player.getLocation(), Sound.ENTITY_IRON_GOLEM_ATTACK, 1.5f, 0.5f);

                          new BukkitRunnable() {
                              int ticks = 0;
                              @Override
                              public void run() {
                                  if (player.isOnGround() || ticks > 25) {
                                      Location loc = player.getLocation();
                                      w.spawnParticle(Particle.BLOCK, loc, 250, 3.0, 0.3, 3.0, Material.STONE.createBlockData());
                                      w.playSound(loc, Sound.ENTITY_GENERIC_EXPLODE, 1.4f, 0.6f);
                                      for (Entity e : player.getNearbyEntities(6, 3, 6)) {
                                          if (e instanceof LivingEntity target && e != player) {
                                              target.damage(8.0 * dmgMod, player);
                                              target.setVelocity(new Vector(0, 0.8, 0));
                                          }
                                      }
                                      cancel();
                                  }
                                  ticks++;
                              }
                          }.runTaskTimer(plugin, 5L, 1L);
                      }
                      case FROST -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Frost Nova", key); return; }
                          cd.setCooldown(player, key, 9 * cdMod);
                          Location loc = player.getLocation();
                          w.playSound(loc, Sound.BLOCK_GLASS_BREAK, 1.5f, 0.5f);
                          w.spawnParticle(Particle.SNOWFLAKE, loc.clone().add(0, 1, 0), 250, 4, 0.5, 4, 0.1);
                          for (Entity e : player.getNearbyEntities(6.5, 3, 6.5)) {
                              if (e instanceof LivingEntity target && e != player) {
                                  target.damage(6.0 * dmgMod, player);
                                  target.setFreezeTicks(240);
                                  target.addPotionEffect(new PotionEffect(PotionEffectType.SLOWNESS, 100, 2));
                              }
                          }
                      }
                      case REAPER -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Death's Scythe", key); return; }
                          cd.setCooldown(player, key, 7 * cdMod);
                          Location loc = player.getEyeLocation();
                          Vector dir = loc.getDirection().normalize();
                          w.playSound(loc, Sound.ENTITY_WITHER_SHOOT, 1.2f, 1.7f);

                          for (double d = 1; d <= 6; d += 0.4) {
                              Location pLoc = loc.clone().add(dir.clone().multiply(d));
                              w.spawnParticle(Particle.SOUL_FIRE_FLAME, pLoc, 8, 0.2, 0.2, 0.2, 0.02);
                          }
                          double stolen = 0;
                          for (Entity e : player.getNearbyEntities(5, 2.5, 5)) {
                              if (e instanceof LivingEntity target && e != player) {
                                  target.damage(7.0 * dmgMod, player);
                                  target.addPotionEffect(new PotionEffect(PotionEffectType.WITHER, 80, 1));
                                  stolen += 2.5;
                              }
                          }
                          if (stolen > 0) {
                              player.setHealth(Math.min(player.getMaxHealth(), player.getHealth() + stolen));
                              w.spawnParticle(Particle.HEART, player.getEyeLocation(), 6, 0.4, 0.4, 0.4);
                          }
                      }
                      case RAGE -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Berserker Cleave", key); return; }
                          cd.setCooldown(player, key, 6 * cdMod);
                          if (player.getHealth() > 2.0) player.setHealth(player.getHealth() - 2.0);
                          Location loc = player.getLocation();
                          w.playSound(loc, Sound.ENTITY_RAVAGER_ATTACK, 1.3f, 1.0f);
                          w.spawnParticle(Particle.SWEEP_ATTACK, loc.clone().add(0, 1, 0), 12, 1.5, 0.3, 1.5);
                          w.spawnParticle(Particle.LAVA, loc.clone().add(0, 1, 0), 20, 0.8, 0.5, 0.8);

                          double missingRatio = 1.0 - (player.getHealth() / player.getMaxHealth());
                          double dynamicDamage = (7.0 + (missingRatio * 10.0)) * dmgMod;
                          for (Entity e : player.getNearbyEntities(4.5, 2, 4.5)) {
                              if (e instanceof LivingEntity target && e != player) {
                                  target.damage(dynamicDamage, player);
                              }
                          }
                      }
                      case AEGIS -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Judgement Beam", key); return; }
                          cd.setCooldown(player, key, 10 * cdMod);
                          RayTraceResult res = player.rayTraceBlocks(16);
                          Location targetLoc = (res != null && res.getHitBlock() != null) ? res.getHitBlock().getLocation().add(0, 1, 0) : player.getLocation().add(player.getLocation().getDirection().multiply(10));
                          w.spawnParticle(Particle.FLASH, targetLoc, 3);
                          w.spawnParticle(Particle.END_ROD, targetLoc, 120, 1.2, 5, 1.2, 0.1);
                          w.playSound(targetLoc, Sound.ITEM_TRIDENT_THUNDER, 1.5f, 1.4f);

                          for (Entity e : w.getNearbyEntities(targetLoc, 4, 4, 4)) {
                              if (e instanceof LivingEntity target && e != player) {
                                  target.damage(9.0 * dmgMod, player);
                                  target.setFireTicks(80);
                              }
                          }
                      }
                      case BLOOM -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Thorn Lash", key); return; }
                          cd.setCooldown(player, key, 8 * cdMod);
                          Vector dir = player.getLocation().getDirection().normalize();
                          Location start = player.getEyeLocation();
                          w.playSound(start, Sound.BLOCK_VINE_BREAK, 1.5f, 0.7f);

                          for (int i = 1; i <= 9; i++) {
                              Location pt = start.clone().add(dir.clone().multiply(i));
                              w.spawnParticle(Particle.HAPPY_VILLAGER, pt, 6, 0.2, 0.2, 0.2);
                              for (Entity e : w.getNearbyEntities(pt, 1.3, 1.3, 1.3)) {
                                  if (e instanceof LivingEntity target && e != player) {
                                      target.damage(6.0 * dmgMod, player);
                                      target.setVelocity(player.getLocation().toVector().subtract(target.getLocation().toVector()).normalize().multiply(0.9));
                                      target.addPotionEffect(new PotionEffect(PotionEffectType.POISON, 100, 1));
                                      return;
                                  }
                              }
                          }
                      }
                      case STORM -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Tempest Strike", key); return; }
                          cd.setCooldown(player, key, 9 * cdMod);
                          RayTraceResult targetRes = player.rayTraceEntities(16);
                          LivingEntity enemy = (targetRes != null && targetRes.getHitEntity() instanceof LivingEntity le && le != player) ? (LivingEntity) targetRes.getHitEntity() : null;
                          if (enemy != null) {
                              Location eLoc = enemy.getLocation();
                              w.strikeLightningEffect(eLoc);
                              enemy.damage(9.5 * dmgMod, player);
                              w.spawnParticle(Particle.ELECTRIC_SPARK, eLoc.add(0, 1, 0), 80, 0.6, 1.2, 0.6, 0.2);
                          }
                      }
                      case VOID -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Event Horizon", key); return; }
                          cd.setCooldown(player, key, 13 * cdMod);
                          RayTraceResult tr = player.rayTraceBlocks(14);
                          Location center = (tr != null && tr.getHitPosition() != null) ? tr.getHitPosition().toLocation(w) : player.getLocation().add(player.getLocation().getDirection().multiply(8));
                          w.playSound(center, Sound.BLOCK_BEACON_DEACTIVATE, 1.8f, 0.5f);

                          new BukkitRunnable() {
                              int timer = 0;
                              @Override
                              public void run() {
                                  w.spawnParticle(Particle.PORTAL, center, 90, 1.8, 1.8, 1.8, 0.5);
                                  for (Entity e : w.getNearbyEntities(center, 7, 7, 7)) {
                                      if (e instanceof LivingEntity target && e != player) {
                                          Vector pull = center.toVector().subtract(target.getLocation().toVector()).normalize().multiply(0.4);
                                          target.setVelocity(pull);
                                      }
                                  }
                                  if (++timer >= 30) {
                                      w.playSound(center, Sound.ENTITY_WARDEN_SONIC_BOOM, 1.5f, 1.2f);
                                      w.spawnParticle(Particle.SONIC_BOOM, center, 1);
                                      for (Entity e : w.getNearbyEntities(center, 4.5, 4.5, 4.5)) {
                                          if (e instanceof LivingEntity target && e != player) {
                                              target.damage(10.0 * dmgMod, player);
                                          }
                                      }
                                      cancel();
                                  }
                              }
                          }.runTaskTimer(plugin, 0L, 1L);
                      }
                      case PHANTOM -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Ambush", key); return; }
                          RayTraceResult ray = player.rayTraceEntities(14);
                          if (ray != null && ray.getHitEntity() instanceof LivingEntity target && target != player) {
                              cd.setCooldown(player, key, 11 * cdMod);
                              Location behind = target.getLocation().subtract(target.getLocation().getDirection().normalize().multiply(1.5));
                              behind.setDirection(target.getLocation().subtract(behind).toVector());
                              player.teleport(behind);
                              target.damage(8.0 * dmgMod, player);
                              target.addPotionEffect(new PotionEffect(PotionEffectType.DARKNESS, 80, 1));
                              w.playSound(behind, Sound.ENTITY_PLAYER_ATTACK_CRIT, 1.3f, 0.8f);
                              w.spawnParticle(Particle.SQUID_INK, behind, 40, 0.5, 1, 0.5, 0.05);
                          }
                      }
                      case KNIGHT -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Shield Charge", key); return; }
                          cd.setCooldown(player, key, 7 * cdMod);
                          player.setVelocity(player.getLocation().getDirection().setY(0.1).normalize().multiply(1.9));
                          w.playSound(player.getLocation(), Sound.ITEM_ARMOR_EQUIP_NETHERITE, 1.5f, 0.7f);

                          new BukkitRunnable() {
                              int runTicks = 0;
                              @Override
                              public void run() {
                                  w.spawnParticle(Particle.CRIT, player.getLocation().add(0, 1, 0), 6, 0.3, 0.3, 0.3, 0.02);
                                  for (Entity e : player.getNearbyEntities(1.6, 1.6, 1.6)) {
                                      if (e instanceof LivingEntity target && e != player) {
                                          target.damage(7.0 * dmgMod, player);
                                          target.setVelocity(player.getLocation().getDirection().multiply(1.4).setY(0.4));
                                          w.playSound(target.getLocation(), Sound.ITEM_SHIELD_BLOCK, 1.5f, 0.6f);
                                          cancel();
                                          return;
                                      }
                                  }
                                  if (++runTicks > 15) cancel();
                              }
                          }.runTaskTimer(plugin, 1L, 1L);
                      }
                  }
              }

              private void triggerSecondary(Player player, AspectType aspect, double cdMod) {
                  String key = "secondary";
                  World w = player.getWorld();

                  switch (aspect) {
                      case TERRA -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Earthen Bastion", key); return; }
                          cd.setCooldown(player, key, 15 * cdMod);
                          player.addPotionEffect(new PotionEffect(PotionEffectType.RESISTANCE, 100, 2));
                          w.playSound(player.getLocation(), Sound.BLOCK_ANVIL_LAND, 1.2f, 0.6f);
                          w.spawnParticle(Particle.BLOCK, player.getLocation(), 120, 2, 0.5, 2, Material.STONE.createBlockData());
                      }
                      case FROST -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Glacial Slide", key); return; }
                          cd.setCooldown(player, key, 8 * cdMod);
                          player.setVelocity(player.getLocation().getDirection().setY(0.05).normalize().multiply(1.7));
                          w.playSound(player.getLocation(), Sound.BLOCK_POWDER_SNOW_STEP, 1.5f, 1.5f);
                      }
                      case REAPER -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Wraith Phase", key); return; }
                          cd.setCooldown(player, key, 13 * cdMod);
                          player.addPotionEffect(new PotionEffect(PotionEffectType.INVISIBILITY, 80, 0, false, false));
                          player.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, 80, 2, false, false));
                          w.playSound(player.getLocation(), Sound.ENTITY_PHANTOM_FLAP, 1.5f, 0.5f);
                      }
                      case RAGE -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Blood Rush", key); return; }
                          cd.setCooldown(player, key, 14 * cdMod);
                          player.removePotionEffect(PotionEffectType.SLOWNESS);
                          player.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, 120, 1));
                          player.addPotionEffect(new PotionEffect(PotionEffectType.STRENGTH, 100, 0));
                          w.playSound(player.getLocation(), Sound.ENTITY_ENDER_DRAGON_GROWL, 1.0f, 1.6f);
                          w.spawnParticle(Particle.ANGRY_VILLAGER, player.getEyeLocation(), 15, 0.4, 0.4, 0.4);
                      }
                      case AEGIS -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Sanctuary", key); return; }
                          cd.setCooldown(player, key, 18 * cdMod);
                          player.addPotionEffect(new PotionEffect(PotionEffectType.ABSORPTION, 160, 1));
                          w.playSound(player.getLocation(), Sound.BLOCK_BEACON_ACTIVATE, 1.5f, 1.8f);
                      }
                      case BLOOM -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Floral Spores", key); return; }
                          cd.setCooldown(player, key, 15 * cdMod);
                          player.addPotionEffect(new PotionEffect(PotionEffectType.REGENERATION, 120, 1));
                          w.playSound(player.getLocation(), Sound.ENTITY_ALLAY_ITEM_TAKEN, 1.5f, 0.6f);
                          w.spawnParticle(Particle.SPORE_BLOSSOM_AIR, player.getLocation().add(0, 1, 0), 150, 3, 1.5, 3);
                      }
                      case STORM -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Lightning Dash", key); return; }
                          cd.setCooldown(player, key, 9 * cdMod);
                          Location to = player.getLocation().add(player.getLocation().getDirection().normalize().multiply(8));
                          if (!to.getBlock().isPassable()) to = player.getLocation();
                          player.teleport(to);
                          w.playSound(to, Sound.ENTITY_LIGHTNING_BOLT_IMPACT, 1f, 1.8f);
                          w.spawnParticle(Particle.ELECTRIC_SPARK, to, 50, 0.5, 1, 0.5, 0.1);
                      }
                      case VOID -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Void Warp", key); return; }
                          cd.setCooldown(player, key, 10 * cdMod);
                          player.setVelocity(player.getLocation().getDirection().multiply(-9).setY(0.25));
                          w.playSound(player.getLocation(), Sound.ENTITY_ENDERMAN_TELEPORT, 1.2f, 0.6f);
                      }
                      case PHANTOM -> {
                          if (cd.isOnCooldown(player, key)) { cd.sendCooldownNotice(player, "Spectral Phase", key); return; }
                          cd.setCooldown(player, key, 20 * cdMod);
                          etherealPlayers.add(player.getUniqueId());
                          player.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, 50, 1));
                          w.playSound(player.getLocation(), Sound.ENTITY_VEX_CHARGE, 1.2f, 0.7f);
                          Bukkit.getScheduler().runTaskLater(plugin, () -> etherealPlayers.remove(player.getUniqueId()), 50L);
                      }
