name: Build BlissAspects

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Plugin Files
        run: |
          mkdir -p src/main/resources src/main/java/com/bliss/aspects

          cat << 'EOF' > pom.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>com.bliss</groupId>
              <artifactId>BlissAspects</artifactId>
              <version>1.0.0</version>
              <packaging>jar</packaging>
              <properties>
                  <java.version>21</java.version>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>
              <repositories>
                  <repository>
                      <id>papermc</id>
                      <url>https://repo.papermc.io/repository/maven-public/</url>
                  </repository>
              </repositories>
              <dependencies>
                  <dependency>
                      <groupId>io.papermc.paper</groupId>
                      <artifactId>paper-api</artifactId>
                      <version>1.21.1-R0.1-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>
              <build>
                  <finalName>BlissAspects</finalName>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.13.0</version>
                          <configuration>
                              <source>21</source>
                              <target>21</target>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF

          cat << 'EOF' > src/main/resources/plugin.yml
          name: BlissAspects
          version: 1.0.0
          main: com.bliss.aspects.BlissAspects
          api-version: '1.21'
          commands:
            aspect:
              permission: bliss.use
          EOF

          cat << 'EOF' > src/main/java/com/bliss/aspects/AspectType.java
          package com.bliss.aspects;
          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.NamedTextColor;
          public enum AspectType {
              TERRA, FROST, REAPER, RAGE, AEGIS, BLOOM, STORM, VOID, PHANTOM, KNIGHT;
              public Component getFormattedName() { return Component.text(name(), NamedTextColor.GOLD); }
          }
          EOF

          cat << 'EOF' > src/main/java/com/bliss/aspects/CooldownManager.java
          package com.bliss.aspects;
          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.NamedTextColor;
          import org.bukkit.entity.Player;
          import java.util.*;
          public class CooldownManager {
              private final Map<UUID, Map<String, Long>> cd = new HashMap<>();
              public boolean isOnCooldown(Player p, String k) {
                  var m = cd.get(p.getUniqueId());
                  return m != null && m.containsKey(k) && System.currentTimeMillis() < m.get(k);
              }
              public void setCooldown(Player p, String k, double s) {
                  cd.computeIfAbsent(p.getUniqueId(), x -> new HashMap<>()).put(k, System.currentTimeMillis() + (long)(s * 1000));
              }
              public void resetCooldowns(Player p) { cd.remove(p.getUniqueId()); }
              public void sendCooldownNotice(Player p, String n, String k) {
                  p.sendActionBar(Component.text(n + " Cooldown!", NamedTextColor.RED));
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/bliss/aspects/AspectManager.java
          package com.bliss.aspects;
          import org.bukkit.NamespacedKey;
          import org.bukkit.entity.Player;
          import org.bukkit.persistence.PersistentDataType;
          public class AspectManager {
              private final NamespacedKey ak, kk;
              public AspectManager(BlissAspects pl) {
                  this.ak = new NamespacedKey(pl, "a");
                  this.kk = new NamespacedKey(pl, "k");
              }
              public void setAspect(Player p, AspectType a) {
                  if (a == null) p.getPersistentDataContainer().remove(ak);
                  else p.getPersistentDataContainer().set(ak, PersistentDataType.STRING, a.name());
              }
              public AspectType getAspect(Player p) {
                  String s = p.getPersistentDataContainer().get(ak, PersistentDataType.STRING);
                  return s != null ? AspectType.valueOf(s) : null;
              }
              public int getKills(Player p) { return p.getPersistentDataContainer().getOrDefault(kk, PersistentDataType.INTEGER, 0); }
              public void setKills(Player p, int k) { p.getPersistentDataContainer().set(kk, PersistentDataType.INTEGER, k); }
              public void addKills(Player p, int a) { setKills(p, getKills(p) + a); }
              public double getDamageMultiplier(Player p) { return 1.0 + (Math.min(5, getKills(p) / 10) * 0.1); }
              public double getCooldownMultiplier(Player p) { return Math.max(0.7, 1.0 - (Math.min(5, getKills(p) / 10) * 0.06)); }
          }
          EOF

          cat << 'EOF' > src/main/java/com/bliss/aspects/GemManager.java
          package com.bliss.aspects;
          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.NamedTextColor;
          import org.bukkit.Material;
          import org.bukkit.NamespacedKey;
          import org.bukkit.inventory.ItemStack;
          import org.bukkit.persistence.PersistentDataType;
          public class GemManager {
              private final NamespacedKey gk, kk;
              public GemManager(BlissAspects pl) {
                  this.gk = new NamespacedKey(pl, "ga");
                  this.kk = new NamespacedKey(pl, "gk");
              }
              public ItemStack createGem(AspectType a, int kills) {
                  var it = new ItemStack(Material.AMETHYST_SHARD);
                  var m = it.getItemMeta();
                  m.displayName(Component.text(a.name() + " Gem", NamedTextColor.LIGHT_PURPLE));
                  m.getPersistentDataContainer().set(gk, PersistentDataType.STRING, a.name());
                  m.getPersistentDataContainer().set(kk, PersistentDataType.INTEGER, kills);
                  it.setItemMeta(m);
                  return it;
              }
              public boolean isGem(ItemStack it) {
                  return it != null && it.hasItemMeta() && it.getItemMeta().getPersistentDataContainer().has(gk, PersistentDataType.STRING);
              }
              public AspectType getGemAspect(ItemStack it) {
                  return AspectType.valueOf(it.getItemMeta().getPersistentDataContainer().get(gk, PersistentDataType.STRING));
              }
              public int getGemKills(ItemStack it) {
                  return it.getItemMeta().getPersistentDataContainer().getOrDefault(kk, PersistentDataType.INTEGER, 0);
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/bliss/aspects/AspectListener.java
          package com.bliss.aspects;
          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.NamedTextColor;
          import org.bukkit.*;
          import org.bukkit.entity.*;
          import org.bukkit.event.*;
          import org.bukkit.event.block.Action;
          import org.bukkit.event.entity.*;
          import org.bukkit.event.player.PlayerInteractEvent;
          import org.bukkit.potion.*;
          import org.bukkit.util.Vector;
          import java.util.*;

          public class AspectListener implements Listener {
              private final BlissAspects pl;
              private final Set<UUID> parry = new HashSet<>(), ghost = new HashSet<>();
              public AspectListener(BlissAspects pl) { this.pl = pl; }

              @EventHandler
              public void onInteract(PlayerInteractEvent e) {
                  Player p = e.getPlayer();
                  var item = p.getInventory().getItemInMainHand();
                  if (pl.getGemManager().isGem(item) && e.getAction().name().contains("RIGHT")) {
                      pl.getAspectManager().setAspect(p, pl.getGemManager().getGemAspect(item));
                      pl.getAspectManager().setKills(p, pl.getGemManager().getGemKills(item));
                      item.subtract(1);
                      p.sendMessage(Component.text("Aspect Gem absorbed!", NamedTextColor.GREEN));
                      e.setCancelled(true);
                      return;
                  }
                  var asp = pl.getAspectManager().getAspect(p);
                  if (asp == null || !e.getAction().name().contains("RIGHT")) return;
                  
                  boolean sneak = p.isSneaking();
                  String k = sneak ? "sec" : "pri";
                  if (pl.getCooldownManager().isOnCooldown(p, k)) {
                      pl.getCooldownManager().sendCooldownNotice(p, k, k);
                      return;
                  }
                  double cd = (sneak ? 14 : 9) * pl.getAspectManager().getCooldownMultiplier(p);
                  pl.getCooldownManager().setCooldown(p, k, cd);
                  cast(p, asp, sneak);
                  e.setCancelled(true);
              }

              private void cast(Player p, AspectType a, boolean sec) {
                  World w = p.getWorld(); Location l = p.getLocation();
                  double d = 6.0 * pl.getAspectManager().getDamageMultiplier(p);
                  Vector dir = l.getDirection();

                  if (sec) {
                      switch(a) {
                          case TERRA -> p.addPotionEffect(new PotionEffect(PotionEffectType.RESISTANCE, 80, 2));
                          case FROST -> p.setVelocity(dir.multiply(1.5).setY(0.1));
                          case REAPER -> { p.addPotionEffect(new PotionEffect(PotionEffectType.INVISIBILITY, 60, 0)); p.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, 60, 2)); }
                          case RAGE -> { p.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, 100, 1)); p.addPotionEffect(new PotionEffect(PotionEffectType.STRENGTH, 80, 0)); }
                          case AEGIS -> p.addPotionEffect(new PotionEffect(PotionEffectType.ABSORPTION, 140, 1));
                          case BLOOM -> p.addPotionEffect(new PotionEffect(PotionEffectType.REGENERATION, 100, 1));
                          case STORM -> { Location t = l.clone().add(dir.multiply(8)); if (t.getBlock().isPassable()) p.teleport(t); w.strikeLightningEffect(t); }
                          case VOID -> p.setVelocity(dir.multiply(-1.5).setY(0.2));
                          case PHANTOM -> { ghost.add(p.getUniqueId()); Bukkit.getScheduler().runTaskLater(pl, () -> ghost.remove(p.getUniqueId()), 40L); }
                          case KNIGHT -> { parry.add(p.getUniqueId()); Bukkit.getScheduler().runTaskLater(pl, () -> parry.remove(p.getUniqueId()), 30L); }
                      }
                      w.playSound(l, Sound.ENTITY_ILLUSIONER_CAST_SPELL, 1f, 1f);
                  } else {
                      w.spawnParticle(Particle.SWEEP_ATTACK, l.add(0, 1, 0), 10, 0.5, 0.5, 0.5);
                      w.playSound(l, Sound.ENTITY_PLAYER_ATTACK_STRONG, 1f, 1f);
                      for (Entity e : p.getNearbyEntities(5, 3, 5)) {
                          if (e instanceof LivingEntity t && t != p) {
                              t.damage(d, p);
                              if (a == AspectType.FROST) t.setFreezeTicks(160);
                              if (a == AspectType.BLOOM) t.addPotionEffect(new PotionEffect(PotionEffectType.POISON, 60, 1));
                              if (a == AspectType.REAPER) p.setHealth(Math.min(20, p.getHealth() + 2));
                              if (a == AspectType.TERRA) t.setVelocity(new Vector(0, 0.6, 0));
                              if (a == AspectType.VOID) t.setVelocity(l.toVector().subtract(t.getLocation().toVector()).normalize().multiply(0.8));
                          }
                      }
                  }
              }

              @EventHandler
              public void onDeath(EntityDeathEvent e) {
                  Player k = e.getEntity().getKiller();
                  if (k != null && pl.getAspectManager().getAspect(k) != null) {
                      pl.getAspectManager().addKills(k, e.getEntity() instanceof Player ? 5 : 1);
                  }
              }

              @EventHandler
              public void onHit(EntityDamageByEntityEvent e) {
                  if (e.getEntity() instanceof Player v && ghost.contains(v.getUniqueId())) e.setCancelled(true);
                  if (e.getEntity() instanceof Player def && parry.contains(def.getUniqueId())) {
                      e.setCancelled(true); parry.remove(def.getUniqueId());
                      def.getWorld().playSound(def.getLocation(), Sound.ITEM_SHIELD_BLOCK, 1f, 1f);
                      if (e.getDamager() instanceof LivingEntity atk) atk.damage(4, def);
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/bliss/aspects/AspectCommand.java
          package com.bliss.aspects;
          import net.kyori.adventure.text.Component;
          import net.kyori.adventure.text.format.NamedTextColor;
          import org.bukkit.Bukkit;
          import org.bukkit.command.*;
          import org.bukkit.entity.Player;
          public class AspectCommand implements CommandExecutor {
              private final BlissAspects pl;
              public AspectCommand(BlissAspects pl) { this.pl = pl; }
              public boolean onCommand(CommandSender s, Command c, String l, String[] a) {
                  if (!(s instanceof Player p)) return true;
                  if (a.length == 0) {
                      var asp = pl.getAspectManager().getAspect(p);
                      p.sendMessage(Component.text("Aspect: " + (asp != null ? asp.name() : "None") + " | Kills: " + pl.getAspectManager().getKills(p), NamedTextColor.YELLOW));
                      return true;
                  }
                  if (a[0].equalsIgnoreCase("give") && p.isOp()) {
                      var target = a.length > 1 ? Bukkit.getPlayer(a[1]) : p;
                      var asp = a.length > 2 ? AspectType.valueOf(a[2].toUpperCase()) : AspectType.TERRA;
                      int kills = a.length > 3 ? Integer.parseInt(a[3]) : 0;
                      if (target != null) target.getInventory().addItem(pl.getGemManager().createGem(asp, kills));
                      return true;
                  }
                  if (a[0].equalsIgnoreCase("resetcd") && p.isOp()) {
                      pl.getCooldownManager().resetCooldowns(p);
                      p.sendMessage(Component.text("Cooldowns reset!", NamedTextColor.GREEN));
                      return true;
                  }
                  return true;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/bliss/aspects/BlissAspects.java
          package com.bliss.aspects;
          import org.bukkit.plugin.java.JavaPlugin;
          import java.util.Objects;
          public final class BlissAspects extends JavaPlugin {
              private AspectManager am;
              private CooldownManager cm;
              private GemManager gm;
              public void onEnable() {
                  this.am = new AspectManager(this);
                  this.cm = new CooldownManager();
                  this.gm = new GemManager(this);
                  getServer().getPluginManager().registerEvents(new AspectListener(this), this);
                  Objects.requireNonNull(getCommand("aspect")).setExecutor(new AspectCommand(this));
              }
              public AspectManager getAspectManager() { return am; }
              public CooldownManager getCooldownManager() { return cm; }
              public GemManager getGemManager() { return gm; }
          }
          EOF

      - name: Build with Maven
        run: mvn clean package --batch-mode

      - name: Upload Finished Jar
        uses: actions/upload-artifact@v4
        with:
          name: BlissAspects-1.21-Plugin
          path: target/BlissAspects.jar
